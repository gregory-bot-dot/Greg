<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ChartVision Pro — Forex & Or en Temps Réel</title>
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root{
    --bg:#0b0e14;--panel:#131722;--panel2:#1a1f2c;
    --line:#232c3d;
    --txt:#d1d4dc;--muted:#8b94a8;--dim:#5d6577;
    --acc:#2962ff;--up:#26a69a;--down:#ef5350;--warn:#ff9800;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--txt); 
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:13px; overflow:hidden;
  }
  header{
    padding:10px 15px; background:#0e1219; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; height:50px; flex-wrap:wrap;
  }
  header h1{font-size:16px;margin:0;font-weight:700; white-space:nowrap;}
  header h1 span{color:var(--acc)}
  .controls{display:flex; gap:6px; margin-left:auto; flex-wrap:wrap;}
  select{
    background:var(--panel2); border:1px solid var(--line); color:var(--txt);
    border-radius:5px; padding:6px 8px; font-size:12px; font-family:inherit; outline:none; font-weight:bold;
  }
  .app{display:flex; height:calc(100vh - 50px);}
  @media(max-width:900px){ .app{flex-direction:column;} }
  .chart-container{flex:1; position:relative; background:#05080c;}
  #chart{width:100%; height:100%;}
  .panel{
    width:380px; background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; overflow-y:auto;
  }
  @media(max-width:900px){ 
    .panel{width:100%; height:40vh; border-left:none; border-top:1px solid var(--line);} 
  }
  .panel-header{padding:12px 15px; border-bottom:1px solid var(--line); font-weight:bold; text-transform:uppercase; font-size:11px; color:var(--muted);}
  .setup{padding:15px; border-bottom:1px solid var(--line);}
  .setup.buy{background:linear-gradient(180deg, rgba(38,166,154,0.1) 0%, transparent 100%);}
  .setup.sell{background:linear-gradient(180deg, rgba(239,83,80,0.1) 0%, transparent 100%);}
  .setup-title{font-weight:bold; font-size:14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;}
  .setup.buy .setup-title{color:var(--up)} .setup.sell .setup-title{color:var(--down)}
  .trade-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .cell{background:rgba(0,0,0,0.3); padding:8px; border-radius:4px; border:1px solid var(--line);}
  .cell small{display:block; color:var(--dim); font-size:10px; text-transform:uppercase; margin-bottom:2px;}
  .cell b{font-family:monospace; font-size:13px;}
  .live-dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--up); margin-right:5px; animation:pulse 1.5s infinite;}
  @keyframes pulse{ 0% { box-shadow: 0 0 0 0 rgba(38,166,154,0.7); } 70% { box-shadow: 0 0 0 6px rgba(38,166,154,0); } 100% { box-shadow: 0 0 0 0 rgba(38,166,154,0); } }
  .btn-test{background:var(--acc); color:#fff; border:none; padding:8px 12px; border-radius:4px; font-size:11px; font-weight:bold; cursor:pointer; margin:10px;}
  .debug-box{background:#1a1f2c; border:1px solid var(--line); padding:10px; margin:10px; border-radius:4px; font-size:11px; color:var(--muted); max-height:150px; overflow:auto; white-space:pre-wrap; word-break:break-all;}
</style>
</head>
<body>

<header>
  <h1>Chart<span>Vision</span> Pro</h1>
  <div class="controls">
    <select id="symbolSelect">
      <optgroup label="Forex">
        <option value="EURUSD">🇪🇺 EUR / USD</option>
        <option value="GBPUSD">🇬🇧 GBP / USD</option>
        <option value="USDJPY">🇺🇸 USD / JPY</option>
        <option value="AUDUSD">🇦🇺 AUD / USD</option>
      </optgroup>
      <optgroup label="Métaux Précieux">
        <option value="XAUUSD" selected>🥇 XAU / USD (Or)</option>
        <option value="XAGUSD">🥈 XAG / USD (Argent)</option>
      </optgroup>
      <optgroup label="Crypto (Bonus)">
        <option value="BTCUSD">₿ BTC / USD</option>
        <option value="ETHUSD">Ξ ETH / USD</option>
      </optgroup>
    </select>
    <select id="tfSelect">
      <option value="1m">1 Minute</option>
      <option value="5m" selected>5 Minutes</option>
      <option value="15m">15 Minutes</option>
      <option value="1h">1 Heure</option>
    </select>
  </div>
</header>

<div class="app">
  <div class="chart-container">
    <div id="chart"></div>
  </div>
  <div class="panel">
    <div class="panel-header">
      <span class="live-dot"></span> Analyse SMC en temps réel
    </div>
    <div id="analysisContent">
      <div style="padding:20px; text-align:center; color:var(--muted);">Chargement des données...</div>
    </div>
    <button class="btn-test" onclick="testConnection()">🔍 Tester la connexion API</button>
    <div id="debugOutput" class="debug-box" style="display:none;"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

let chart, candleSeries;
let currentData = [];
let currentSymbol = 'XAUUSD';
let currentTF = '5m';
let currentPrice = 0;
let updateInterval = null;

function getDecimals(symbol) {
  if(symbol.includes('JPY')) return 3;
  if(symbol === 'XAUUSD') return 2;
  if(symbol === 'BTCUSD') return 2;
  return 5;
}

/* =========================================
   INITIALISATION DU GRAPHIQUE
   ========================================= */
function initChart() {
  const chartContainer = $('chart');
  chart = LightweightCharts.createChart(chartContainer, {
    layout: { background: { type: 'solid', color: '#05080c' }, textColor: '#d1d4dc' },
    grid: { vertLines: { color: '#1a1f2c' }, horzLines: { color: '#1a1f2c' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#232c3d' },
    timeScale: { borderColor: '#232c3d', timeVisible: true, secondsVisible: false },
  });
  candleSeries = chart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
  });
  new ResizeObserver(entries => {
    if (entries.length === 0 || entries[0].target !== chartContainer) return;
    const newRect = entries[0].contentRect;
    chart.applyOptions({ width: newRect.width, height: newRect.height });
  }).observe(chartContainer);
}

/* =========================================
   TEST DE CONNEXION (Debug)
   ========================================= */
async function testConnection() {
  const debug = $('debugOutput');
  debug.style.display = 'block';
  debug.textContent = "Test en cours...\n";

  const url = `https://biquote.io/api/${currentSymbol}/ohlc?interval=${currentTF}&limit=5`;
  debug.textContent += `URL: ${url}\n`;

  try {
    const response = await fetch(url);
    debug.textContent += `Statut HTTP: ${response.status}\n`;
    const text = await response.text();
    debug.textContent += `Réponse brute:\n${text.substring(0, 500)}\n`;
  } catch (err) {
    debug.textContent += `Erreur réseau: ${err.message}\n`;
    debug.textContent += "→ L'API est peut-être bloquée par le navigateur (CORS).\n";
    debug.textContent += "→ Essayez avec le proxy CORS ci-dessous.\n";
  }
}

/* =========================================
   RÉCUPÉRATION DES DONNÉES (avec proxy CORS)
   ========================================= */
async function fetchData() {
  try {
    // On utilise un proxy CORS public pour éviter les blocages réseau
    const targetUrl = `https://biquote.io/api/${currentSymbol}/ohlc?interval=${currentTF}&limit=200`;
    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

    const response = await fetch(proxyUrl);
    if (!response.ok) throw new Error(`Erreur HTTP: ${response.status}`);

    const result = await response.json();
    const bars = result.bars || [];
    if (bars.length === 0) throw new Error("Aucune donnée reçue (marché fermé ?)");

    // Formatage : openTime est une chaîne ISO 8601
    currentData = bars.map(d => ({
      time: new Date(d.openTime).getTime() / 1000,
      open: d.open,
      high: d.high,
      low: d.low,
      close: d.close
    })).sort((a, b) => a.time - b.time);

    candleSeries.setData(currentData);
    currentPrice = currentData[currentData.length - 1].close;
    analyzeSMC();
  } catch (err) {
    console.error("Erreur API:", err);
    $('analysisContent').innerHTML = `<div style="padding:20px; color:var(--down);">
      Erreur de connexion.<br><br>
      <small>${err.message}</small><br><br>
      <small>Cliquez sur « Tester la connexion API » pour voir le détail.</small>
    </div>`;
  }
}

/* =========================================
   ANALYSE SMC (identique)
   ========================================= */
function analyzeSMC() {
  if (currentData.length < 10) return;

  const swings = [];
  for (let i = 2; i < currentData.length - 2; i++) {
    const c = currentData[i];
    if (c.high > currentData[i-1].high && c.high > currentData[i+1].high)
      swings.push({ index: i, price: c.high, type: 'H' });
    if (c.low < currentData[i-1].low && c.low < currentData[i+1].low)
      swings.push({ index: i, price: c.low, type: 'L' });
  }

  const highs = swings.filter(s => s.type === 'H');
  const lows = swings.filter(s => s.type === 'L');
  let trend = 'neutral';
  if (highs.length >= 2 && lows.length >= 2) {
    const lastH = highs[highs.length-1];
    const prevH = highs[highs.length-2];
    const lastL = lows[lows.length-1];
    const prevL = lows[lows.length-2];
    if (lastH.price > prevH.price && lastL.price > prevL.price) trend = 'up';
    if (lastH.price < prevH.price && lastL.price < prevL.price) trend = 'down';
  }

  let lastOB = null;
  for (let i = currentData.length - 5; i < currentData.length - 1; i++) {
    const c = currentData[i];
    const prev = currentData[i-1];
    if (c.close > c.open && prev.close < prev.open) {
      const bodySize = Math.abs(c.close - c.open);
      if (bodySize > (currentPrice * 0.0001)) {
        lastOB = { type: 'bullish', top: prev.high, bottom: prev.low };
      }
    }
  }

  const longEntry = lastOB ? lastOB.top : currentPrice * 0.999;
  const longSL = lastOB ? lastOB.bottom * 0.9995 : currentPrice * 0.998;
  const longTP = currentPrice * 1.002;
  const shortEntry = currentPrice * 1.001;
  const shortSL = currentPrice * 1.002;
  const shortTP = currentPrice * 0.998;

  renderPanel(trend, lastOB, longEntry, longSL, longTP, shortEntry, shortSL, shortTP);
  drawLines(longEntry, longSL, longTP, shortEntry, shortSL, shortTP);
}

/* =========================================
   AFFICHAGE
   ========================================= */
function renderPanel(trend, ob, lE, lS, lT, sE, sS, sT) {
  const dec = getDecimals(currentSymbol);
  const fmt = (p) => p.toLocaleString('fr-FR', {minimumFractionDigits: dec, maximumFractionDigits: dec});
  const trendColor = trend === 'up' ? 'var(--up)' : trend === 'down' ? 'var(--down)' : 'var(--warn)';
  const trendText = trend === 'up' ? 'HAUSSIÈRE' : trend === 'down' ? 'BAISSIÈRE' : 'NEUTRE';

  let html = `
    <div style="padding:15px; border-bottom:1px solid var(--line);">
      <div style="font-size:12px; color:var(--muted); margin-bottom:5px;">Prix Actuel : ${fmt(currentPrice)}</div>
      <div style="font-size:16px; font-weight:bold; color:${trendColor}">Tendance : ${trendText}</div>
    </div>
  `;
  if (ob) {
    html += `
      <div style="padding:10px 15px; background:rgba(41,98,255,0.1); border-bottom:1px solid var(--line); font-size:12px;">
        🟦 <b>Order Block haussier détecté</b><br>
        Zone : ${fmt(ob.bottom)} - ${fmt(ob.top)}
      </div>
    `;
  }
  html += `
    <div class="setup buy">
      <div class="setup-title">
        <span>🟢 Setup ACHAT</span>
        ${trend === 'up' ? '<span style="font-size:10px;background:var(--up);color:#000;padding:2px 6px;border-radius:10px;">FAVORI</span>' : ''}
      </div>
      <div class="trade-grid">
        <div class="cell"><small>Entrée</small><b>${fmt(lE)}</b></div>
        <div class="cell"><small>Stop-Loss</small><b>${fmt(lS)}</b></div>
        <div class="cell"><small>Take-Profit</small><b>${fmt(lT)}</b></div>
        <div class="cell"><small>R:R</small><b>${((lT-lE)/(lE-lS)).toFixed(2)}</b></div>
      </div>
    </div>
    <div class="setup sell">
      <div class="setup-title">
        <span>🔴 Setup VENTE</span>
        ${trend === 'down' ? '<span style="font-size:10px;background:var(--down);color:#fff;padding:2px 6px;border-radius:10px;">FAVORI</span>' : ''}
      </div>
      <div class="trade-grid">
        <div class="cell"><small>Entrée</small><b>${fmt(sE)}</b></div>
        <div class="cell"><small>Stop-Loss</small><b>${fmt(sS)}</b></div>
        <div class="cell"><small>Take-Profit</small><b>${fmt(sT)}</b></div>
        <div class="cell"><small>R:R</small><b>${((sE-sT)/(sS-sE)).toFixed(2)}</b></div>
      </div>
    </div>
  `;
  $('analysisContent').innerHTML = html;
}

function drawLines(lE, lS, lT, sE, sS, sT) {
  candleSeries.setData(currentData);
  const addLine = (price, color, title, style) => {
    candleSeries.createPriceLine({
      price: price, color: color, lineWidth: 1,
      lineStyle: style, axisLabelVisible: true, title: title,
    });
  };
  addLine(lE, '#2962ff', 'Entrée L', LightweightCharts.LineStyle.Solid);
  addLine(lS, '#ef5350', 'SL L', LightweightCharts.LineStyle.Dashed);
  addLine(lT, '#26a69a', 'TP L', LightweightCharts.LineStyle.Dashed);
}

/* =========================================
   LANCEMENT
   ========================================= */
initChart();
fetchData();

function startAutoUpdate() {
  if (updateInterval) clearInterval(updateInterval);
  updateInterval = setInterval(fetchData, 5000);
}
startAutoUpdate();

$('symbolSelect').addEventListener('change', (e) => {
  currentSymbol = e.target.value;
  $('analysisContent').innerHTML = '<div style="padding:20px; text-align:center;">Changement d\'actif...</div>';
  fetchData();
});
$('tfSelect').addEventListener('change', (e) => {
  currentTF = e.target.value;
  $('analysisContent').innerHTML = '<div style="padding:20px; text-align:center;">Changement de timeframe...</div>';
  fetchData();
});
</script>
</body>
</html>
