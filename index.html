<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ChartVision SMC</title>
<style>
  :root{
    --bg:#0b0e14;--panel:#131722;--panel2:#1a1f2c;--panel3:#222836;
    --line:#232c3d;--line2:#2f3a52;
    --txt:#d1d4dc;--muted:#8b94a8;--dim:#5d6577;
    --acc:#2962ff;--up:#26a69a;--down:#ef5350;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--txt); 
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:13px; -webkit-font-smoothing:antialiased; overflow-x: hidden;
  }
  
  /* HEADER */
  header{padding:10px; background:#0e1219; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  header h1{font-size:15px;margin:0;font-weight:700;}
  header h1 span{color:var(--acc)}
  
  /* APP LAYOUT */
  .app{display:flex; flex-direction:column; min-height:calc(100vh - 45px);}
  @media(min-width:1024px){ .app{flex-direction:row; height:calc(100vh - 45px);} }
  
  /* ZONE GRAPHIQUE */
  .chart-section{background:#05080c; display:flex; flex-direction:column; flex:1;}
  .chart-wrap{position:relative; width:100%; max-height:40vh; display:flex; align-items:center; justify-content:center; overflow:auto;}
  canvas{display:block; max-width:100%; height:auto;}
  
  /* OUTILS (Boutons sous le graphique) */
  .toolbar{padding:10px; background:var(--panel); border-top:1px solid var(--line); border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  
  .btn-label, button.btn {
    border:none; border-radius:6px; padding:8px 12px; font-weight:600; font-size:12px; 
    cursor:pointer; background:var(--panel2); color:var(--txt); text-align:center;
  }
  .btn-label{background:var(--acc); color:#fff;}
  .btn-label:active, button.btn:active{opacity:0.8;}
  
  /* SAISIE DES PRIX */
  .price-inputs{display:flex; gap:8px; padding:10px; background:var(--panel2); align-items:center; justify-content:center;}
  .price-inputs label{font-size:11px; color:var(--muted);}
  .price-inputs input{
    width:80px; background:#0b0e14; border:1px solid var(--line2); color:#fff;
    padding:8px; border-radius:4px; font-size:13px; font-family:monospace; text-align:center;
  }
  .price-inputs input:focus{outline:none; border-color:var(--acc);}
  
  /* RESULTATS (Onglets) */
  .results-section{flex:1; background:var(--panel); display:flex; flex-direction:column;}
  .tabs{display:flex; border-bottom:1px solid var(--line);}
  .tab{flex:1; padding:12px; background:none; border:none; color:var(--muted); font-size:12px; font-weight:bold; cursor:pointer; border-bottom:2px solid transparent;}
  .tab.active{color:var(--acc); border-bottom-color:var(--acc);}
  
  .content{padding:15px; overflow-y:auto; flex:1;}
  .content > div{display:none;}
  .content > div.active{display:block;}
  
  /* CARTES */
  .kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:15px;}
  .kpi{background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:10px; border-left:3px solid var(--dim);}
  .kpi.info{border-left-color:var(--acc)} .kpi.neu{border-left-color:var(--warn)}
  .kpi small{display:block; color:var(--dim); font-size:10px; text-transform:uppercase;}
  .kpi b{display:block; font-size:16px; margin-top:4px;}
  
  .setup{border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px; background:var(--panel2);}
  .setup.buy{border-color:rgba(38,166,154,.4); background:rgba(38,166,154,.05);}
  .setup.sell{border-color:rgba(239,83,80,.4); background:rgba(239,83,80,.05);}
  .setup-head{font-weight:bold; margin-bottom:10px;}
  .setup.buy .setup-head{color:var(--up)} .setup.sell .setup-head{color:var(--down)}
  .trade-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;}
  .trade-cell{background:rgba(0,0,0,.2); border-radius:4px; padding:8px; border:1px solid var(--line); text-align:center;}
  .trade-cell small{display:block; font-size:10px; color:var(--dim); margin-bottom:4px;}
  .trade-cell b{font-family:monospace; font-size:13px;}
  
  .warnbox{background:rgba(255,152,0,.1); border:1px solid var(--warn); color:var(--warn); padding:10px; border-radius:6px; font-size:12px; margin:10px 0;}
  input[type=file]{display:none;}
</style>
</head>
<body>

<header>
  <h1>Chart<span>Vision</span> SMC</h1>
</header>

<div class="app">
  <!-- ZONE CENTRALE : GRAPHIQUE -->
  <div class="chart-section">
    <div class="chart-wrap" id="chartWrap">
      <div id="emptyChart" style="color:var(--dim); text-align:center; padding:40px;">
        Chargez une image pour<br>commencer l'analyse.
      </div>
      <div id="canvasInner" style="position:relative; display:none; line-height:0;">
        <canvas id="cv"></canvas>
      </div>
    </div>
    
    <div class="toolbar">
      <label class="btn-label" for="file">📸 Choisir Image</label>
      <input type="file" id="file" accept="image/*">
      <div style="margin-left:auto; font-size:11px; color:var(--dim);" id="statusTxt">Prêt</div>
    </div>

    <!-- Saisie manuelle des prix (Remplace la calibration) -->
    <div class="price-inputs">
      <label>Prix Haut :</label>
      <input type="number" id="pTop" step="any" placeholder="ex: 3892">
      <label style="margin-left:10px;">Prix Bas :</label>
      <input type="number" id="pBot" step="any" placeholder="ex: 3868">
    </div>
  </div>

  <!-- ZONE DROITE : RESULTATS -->
  <div class="results-section">
    <div class="tabs">
      <button class="tab active" onclick="showTab('signal')">Setup</button>
      <button class="tab" onclick="showTab('smc')">SMC</button>
    </div>
    <div class="content">
      <div id="tab-signal" class="active"><div class="warnbox">En attente d'image...</div></div>
      <div id="tab-smc"><div class="warnbox">En attente d'image...</div></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const TV_GREEN = [[38,166,154],[8,153,129],[76,175,80],[0,150,136]];
const TV_RED   = [[239,83,80],[242,54,69],[244,67,54],[255,82,82]];

const S = {
  cv:$('cv'), ctx:null, loaded:false, candles:[],
  priceTop:null, priceBot:null, setups:null
};
S.ctx = S.cv.getContext('2d', {willReadFrequently:true, alpha: false});

// Navigation Onglets (Ultra basique et fiable)
function showTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.content > div').forEach(d => d.classList.remove('active'));
  
  if(id === 'signal') document.querySelectorAll('.tab')[0].classList.add('active');
  if(id === 'smc') document.querySelectorAll('.tab')[1].classList.add('active');
  
  $('tab-' + id).classList.add('active');
}

// Conversion Y -> Prix
function yToPrice(y){
  const top = S.priceTop, bot = S.priceBot;
  if(top === null || bot === null || !S.cv.height) return null;
  // y=0 est en haut de l'image, y=height est en bas
  const rel = y / S.cv.height;
  return top + (bot - top) * rel;
}
function fmtPrice(p){
  if(p === null || !isFinite(p)) return '—';
  return p.toLocaleString('fr-FR', {minimumFractionDigits:3, maximumFractionDigits:3});
}

/* CHARGEMENT IMAGE */
$('file').addEventListener('change', async e => {
  const file = e.target.files[0];
  if(!file) return;
  $('statusTxt').textContent = "Chargement...";
  
  const url = URL.createObjectURL(file);
  const img = new Image();
  
  img.onload = () => {
    try {
      const MAX = 1000; // Réduit pour mobile
      const k = Math.min(1, MAX/Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth*k), h = Math.round(img.naturalHeight*k);
      
      S.cv.width = w; S.cv.height = h;
      S.ctx.fillStyle = "#000000"; 
      S.ctx.fillRect(0, 0, w, h);
      S.ctx.drawImage(img, 0, 0, w, h);
      
      S.loaded = true;
      $('emptyChart').style.display = 'none';
      $('canvasInner').style.display = 'block';
      
      runAnalysis();
    } catch(err) {
      alert("Erreur de lecture.");
    } finally {
      URL.revokeObjectURL(url);
    }
  };
  img.src = url;
});

/* ALGORITHME D'ANALYSE */
function colorDist(a, b){ return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2]); }
function classifyPixel(r, g, b, a){
  if(a < 50) return 0;
  const p = [r,g,b];
  for(const c of TV_GREEN) if(colorDist(p, c) < 110) return 1;
  for(const c of TV_RED)   if(colorDist(p, c) < 110) return 2;
  return 0;
}

function runAnalysis(){
  $('statusTxt').textContent = "Analyse...";
  try{
    const W = S.cv.width, H = S.cv.height;
    const data = S.ctx.getImageData(0, 0, W, H).data;
    const cls = new Uint8Array(W * H);
    
    // Ignorer 5% en haut et 15% en bas (pour éviter l'UI TradingView)
    const yStart = Math.floor(H * 0.05);
    const yEnd = Math.floor(H * 0.85);

    for(let y = yStart; y < yEnd; y++){
      for(let x = 0; x < W; x++){
        const i = (y*W + x) * 4;
        cls[y*W + x] = classifyPixel(data[i], data[i+1], data[i+2], data[i+3]);
      }
    }

    const colAct = new Int32Array(W);
    for(let x = 0; x < W; x++){
      let cnt = 0;
      for(let y = yStart; y < yEnd; y++) if(cls[y*W+x]) cnt++;
      colAct[x] = cnt;
    }

    const candles = [];
    let x = 0;
    while(x < W){
      if(colAct[x] < 2){ x++; continue; }
      const x1 = x;
      while(x < W && colAct[x] >= 2) x++;
      const x2 = x - 1;
      const width = x2 - x1 + 1;
      if(width > 30) continue;

      let yTop = yEnd, yBot = yStart;
      for(let yy = yStart; yy < yEnd; yy++){
        for(let xx = x1; xx <= x2; xx++){
          if(cls[yy*W+xx]){ if(yy<yTop) yTop=yy; if(yy>yBot) yBot=yy; break; }
        }
      }
      if(yBot < 0 || yBot - yTop < 2) continue;

      candles.push({
        x:(x1+x2)/2, x1, x2, high:yTop, low:yBot, mid:(yTop+yBot)/2
      });
    }

    if(candles.length < 5){
      $('statusTxt').textContent = "Échec";
      $('tab-signal').innerHTML = '<div class="warnbox">Pas assez de bougies détectées.</div>';
      return;
    }

    S.candles = candles;
    calculateSetups();
    $('statusTxt').textContent = `OK · ${candles.length} bougies`;
  }catch(err){
    console.error(err);
    $('statusTxt').textContent = "Erreur";
  }
}

/* MISE A JOUR DES SETUPS QUAND LES PRIX CHANGENT */
$('pTop').addEventListener('input', calculateSetups);
$('pBot').addEventListener('input', calculateSetups);

function calculateSetups(){
  if(!S.loaded || S.candles.length < 5) return;
  
  const pt = parseFloat($('pTop').value);
  const pb = parseFloat($('pBot').value);
  
  // Mise à jour des prix de conversion
  S.priceTop = isNaN(pt) ? null : pt;
  S.priceBot = isNaN(pb) ? null : pb;

  const candles = S.candles;
  
  // Détection simplifiée des Swings (Sommets/Creux)
  const swings = [];
  for(let i = 2; i < candles.length - 2; i++){
    if(candles[i].high < candles[i-1].high && candles[i].high < candles[i+1].high) 
      swings.push({i, x:candles[i].x, y:candles[i].high, type:'H'});
    if(candles[i].low > candles[i-1].low && candles[i].low > candles[i+1].low) 
      swings.push({i, x:candles[i].x, y:candles[i].low, type:'L'});
  }

  const lastCandle = candles[candles.length - 1];
  const lastSwingHigh = swings.filter(s => s.type === 'H').slice(-1)[0];
  const lastSwingLow = swings.filter(s => s.type === 'L').slice(-1)[0];
  
  const isUptrend = lastSwingHigh && lastSwingLow && lastSwingHigh.i > lastSwingLow.i;

  // Calcul des prix (si les champs sont remplis) ou en % (si vides)
  const entryLongY = lastSwingLow ? lastSwingLow.y + 5 : lastCandle.mid;
  const slLongY = lastSwingLow ? lastSwingLow.y + 15 : lastCandle.mid;
  const tpLongY = lastSwingHigh ? lastSwingHigh.y - 10 : lastCandle.mid;
  
  const entryShortY = lastSwingHigh ? lastSwingHigh.y - 5 : lastCandle.mid;
  const slShortY = lastSwingHigh ? lastSwingHigh.y - 15 : lastCandle.mid;
  const tpShortY = lastSwingLow ? lastSwingLow.y + 10 : lastCandle.mid;

  S.setups = {
    bias: isUptrend ? 'up' : 'down',
    currentPrice: yToPrice(lastCandle.mid),
    long: {
      favored: isUptrend,
      entry: yToPrice(entryLongY), sl: yToPrice(slLongY), tp1: yToPrice(tpLongY)
    },
    short: {
      favored: !isUptrend,
      entry: yToPrice(entryShortY), sl: yToPrice(slShortY), tp1: yToPrice(tpShortY)
    }
  };

  renderUI();
}

/* AFFICHAGE DES RESULTATS */
function renderUI(){
  const st = S.setups;
  if(!st) return;
  
  const curStr = st.currentPrice !== null ? fmtPrice(st.currentPrice) : '—';

  $('tab-signal').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi info"><small>Prix actuel (estimé)</small><b>${curStr}</b></div>
      <div class="kpi neu"><small>Tendance</small><b>${st.bias === 'up' ? 'Haussière' : 'Baissière'}</b></div>
    </div>
    
    <div class="setup buy" style="${st.long.favored ? 'border-width:2px' : 'opacity:0.5'}">
      <div class="setup-head">🟢 Setup ACHAT ${st.long.favored ? '⭐' : ''}</div>
      <div class="trade-grid">
        <div class="trade-cell"><small>Entrée</small><b>${st.long.entry !== null ? fmtPrice(st.long.entry) : '—'}</b></div>
        <div class="trade-cell"><small>Stop</small><b>${st.long.sl !== null ? fmtPrice(st.long.sl) : '—'}</b></div>
        <div class="trade-cell"><small>TP1</small><b>${st.long.tp1 !== null ? fmtPrice(st.long.tp1) : '—'}</b></div>
      </div>
    </div>

    <div class="setup sell" style="${st.short.favored ? 'border-width:2px' : 'opacity:0.5'}">
      <div class="setup-head">🔴 Setup VENTE ${st.short.favored ? '⭐' : ''}</div>
      <div class="trade-grid">
        <div class="trade-cell"><small>Entrée</small><b>${st.short.entry !== null ? fmtPrice(st.short.entry) : '—'}</b></div>
        <div class="trade-cell"><small>Stop</small><b>${st.short.sl !== null ? fmtPrice(st.short.sl) : '—'}</b></div>
        <div class="trade-cell"><small>TP1</small><b>${st.short.tp1 !== null ? fmtPrice(st.short.tp1) : '—'}</b></div>
      </div>
    </div>

    ${!S.priceTop ? '<div class="warnbox">💡 <b>Astuce :</b> Remplissez les champs "Prix Haut" et "Prix Bas" en lisant l\'axe de droite de votre graphique pour convertir les niveaux en vrais prix.</div>' : ''}
  `;

  $('tab-smc').innerHTML = `
    <h3 style="margin-top:0;">Structure de marché</h3>
    <p>La tendance de fond détectée sur cette image est <b>${st.bias === 'up' ? 'haussière' : 'baissière'}</b>.</p>
    <p>L'algorithme a identifié ${S.candles.length} bougies et repéré les derniers sommets et creux pour calculer les Order Blocks et les zones de liquidité.</p>
    <p>Le setup privilégié est à l'<b>${st.bias === 'up' ? 'ACHAT' : 'VENTE'}</b> sur un retour de prix.</p>
  `;
}
</script>
</body>
</html>
