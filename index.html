<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ChartVision Pro — Multi-Stratégies</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root{
    --bg:#0b0e14;--panel:#131722;--panel2:#1a1f2c;--line:#2f3a52;
    --txt:#e8eef7;--muted:#8b94a8;--acc:#2962ff;--up:#26a69a;--down:#ef5350;--warn:#ff9800;--fvg:#ab47bc;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%; margin:0; padding:0; overflow:hidden;}
  body{ background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; }
  
  header{ padding:10px 15px; background:#0e1219; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  header h1{font-size:18px;margin:0;font-weight:700; white-space:nowrap;}
  header h1 span{color:var(--acc)}
  
  .controls{display:flex; gap:8px; flex:1; min-width:250px;}
  select{
    flex:1; background:var(--panel2); border:1px solid var(--line); color:#fff;
    border-radius:6px; padding:8px; font-size:13px; font-family:inherit; outline:none; font-weight:600;
    appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238b94a8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
    background-repeat: no-repeat; background-position: right 10px top 50%; background-size: 10px auto;
  }
  
  .app{display:flex; flex:1; overflow:hidden; position:relative;}
  @media(max-width:900px){ .app{flex-direction:column;} }
  
  .chart-container{ flex:1; position:relative; background:#05080c; min-height: 300px; }
  #chart{ position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; }
  #overlayCanvas { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 2; pointer-events: none; }
  
  .panel{ width:340px; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; overflow-y:auto; }
  @media(max-width:900px){ .panel{width:100%; height:65vh; border-left:none; border-top:1px solid var(--line);} }
  
  /* TABS */
  .tabs { display: flex; border-bottom: 1px solid var(--line); background: #0e1219; position: sticky; top: 0; z-index: 10; }
  .tab { flex: 1; padding: 12px; text-align: center; font-size: 11px; font-weight: bold; color: var(--muted); cursor: pointer; text-transform: uppercase; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--acc); border-bottom-color: var(--acc); background: var(--panel); }

  .mtf-row { display: flex; gap: 6px; padding: 10px 15px; border-bottom: 1px solid var(--line); background: rgba(0,0,0,0.2); }
  .mtf-badge { flex: 1; text-align: center; padding: 6px; border-radius: 6px; font-size: 11px; font-weight: bold; border: 1px solid var(--line); background: var(--panel2); color: var(--muted); display:flex; flex-direction:column; justify-content:center; align-items:center;}
  .mtf-badge.up { border-color: var(--up); color: var(--up); background: rgba(38,166,154,0.1); }
  .mtf-badge.down { border-color: var(--down); color: var(--down); background: rgba(239,83,80,0.1); }

  #tradeStatusClassic, #tradeStatusOPR { padding: 12px 15px; font-weight: bold; font-size: 13px; text-align: center; border-bottom: 1px solid var(--line); }
  .status-wait { background: rgba(255,152,0,0.15); color: var(--warn); }
  .status-progress { background: rgba(38,166,154,0.15); color: var(--up); }
  .status-invalid { background: rgba(239,83,80,0.15); color: var(--down); }

  .panel-header{padding:12px 15px; border-bottom:1px solid var(--line); font-weight:bold; text-transform:uppercase; font-size:11px; color:var(--muted); display: flex; justify-content: space-between; align-items: center;}
  
  .setup-compact { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid var(--line); }
  .setup-compact.buy { background: rgba(38,166,154,0.05); border-left: 4px solid var(--up); }
  .setup-compact.sell { background: rgba(239,83,80,0.05); border-left: 4px solid var(--down); }
  .sc-item { text-align: center; }
  .sc-label { display: block; font-size: 9px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px;}
  .sc-val { font-family: monospace; font-size: 14px; font-weight: bold; }
  .sc-val.entry { color: var(--acc); }
  .sc-val.sl { color: var(--down); }
  .sc-val.tp { color: var(--up); }

  .opr-legend { padding: 10px 15px; font-size: 11px; display: flex; flex-wrap: wrap; gap: 8px; background: rgba(0,0,0,0.1); }
  .leg-item { display: flex; align-items: center; gap: 4px; }
  .leg-color { width: 10px; height: 10px; border-radius: 2px; }

  .loading-text { padding:20px; text-align:center; color:var(--muted); font-size:13px; }
</style>
</head>
<body>

<header>
  <h1>Chart<span>Vision</span></h1>
  <div class="controls">
    <select id="symbolSelect">
      <option value="XAUUSD">🥇 XAU/USD</option>
      <option value="BTCUSD">₿ BTC/USD</option>
      <option value="EURUSD">🇪🇺 EUR/USD</option>
      <option value="US500">🇺🇸 US S&P 500</option>
    </select>
    <select id="tfSelect">
      <option value="1m">1m</option>
      <option value="5m">5m</option>
      <option value="15m">15m</option>
      <option value="1h">1h</option>
      <option value="4h">4h</option>
      <option value="1d">1D (Daily)</option>
    </select>
  </div>
</header>

<div class="app">
  <div class="chart-container" id="chartContainer">
    <div id="chart"></div>
    <canvas id="overlayCanvas"></canvas>
  </div>
  
  <div class="panel">
    <div class="tabs">
      <div class="tab active" id="tab-classic" onclick="switchTab('classic')">SMC Classique</div>
      <div class="tab" id="tab-opr" onclick="switchTab('opr')">OPR GOLD</div>
    </div>

    <!-- VIEW SMC CLASSIQUE -->
    <div id="view-classic" style="display:block;">
      <div class="mtf-row">
        <div class="mtf-badge" id="badge-current"><span>...</span></div>
        <div class="mtf-badge" id="badge-htf1"><span>...</span></div>
        <div class="mtf-badge" id="badge-htf2"><span>...</span></div>
      </div>
      <div id="tradeStatusClassic" class="status-wait">Recherche de structure SMC...</div>
      
      <div class="panel-header"><div>Setup SMC Actif</div></div>
      <div id="analysisContentClassic"><div class="loading-text">Aucun trade actif</div></div>
    </div>

    <!-- VIEW OPR GOLD -->
    <div id="view-opr" style="display:none;">
      <div id="tradeStatusOPR" class="status-wait">Chargement OPR...</div>
      
      <div class="opr-legend">
        <div class="leg-item"><div class="leg-color" style="background:#ff9800"></div> Zone OPR</div>
        <div class="leg-item"><div class="leg-color" style="background:#2196f3"></div> Asie</div>
        <div class="leg-item"><div class="leg-color" style="background:#9c27b0"></div> Londres</div>
      </div>

      <div class="panel-header"><div>Setup OPR Actif</div></div>
      <div id="analysisContentOPR"><div class="loading-text">Recherche...</div></div>
    </div>

  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let chart, candleSeries;
let currentData = [];
let currentSymbol = 'XAUUSD';
let currentTF = '1m';
let currentPrice = 0;
let currentTab = 'classic';
let currentTime = 0;

// Variables SMC Classique
let smcSetup = null; 

// Variables OPR
let oprState = { 
    levels: { oprH: null, oprL: null, asiaH: null, asiaL: null, lonH: null, lonL: null },
    startTime: null, endTime: null,
    valid: false,
    setup: null
};

const overlayCanvas = $('overlayCanvas');
const ctx = overlayCanvas.getContext('2d');

if(localStorage.getItem('cv_symbol')) currentSymbol = localStorage.getItem('cv_symbol');
if(localStorage.getItem('cv_tf')) currentTF = localStorage.getItem('cv_tf');

function getDecimals(symbol) {
  if(symbol.includes('JPY')) return 3; if(symbol === 'XAUUSD') return 2; if(symbol === 'BTCUSD' || symbol === 'US500' || symbol === 'US100') return 1; return 5;
}
const fmt = (p) => p.toLocaleString('fr-FR', {minimumFractionDigits: getDecimals(currentSymbol), maximumFractionDigits: getDecimals(currentSymbol)});

function switchTab(tab) {
    currentTab = tab;
    $('tab-classic').classList.toggle('active', tab === 'classic');
    $('tab-opr').classList.toggle('active', tab === 'opr');
    
    $('view-classic').style.display = tab === 'classic' ? 'block' : 'none';
    $('view-opr').style.display = tab === 'opr' ? 'block' : 'none';
    
    if (tab === 'opr') {
        if (currentTF !== '1m') {
            currentTF = '1m';
            $('tfSelect').value = '1m';
            fetchMainData();
        }
        analyzeOPR();
    } else {
        analyzeSMCClassic();
    }
    draw();
}

/* =========================================
   INITIALISATION
   ========================================= */
function initChart() {
  const chartContainer = $('chart');
  chart = LightweightCharts.createChart(chartContainer, {
    layout: { background: { type: 'solid', color: '#05080c' }, textColor: '#d1d4dc' },
    grid: { vertLines: { color: '#1a1f2c' }, horzLines: { color: '#1a1f2c' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#2f3a52' },
    timeScale: { borderColor: '#2f3a52', timeVisible: true, secondsVisible: false },
  });
  candleSeries = chart.addCandlestickSeries({ upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350' });
  
  new ResizeObserver(() => {
    const rect = chartContainer.getBoundingClientRect();
    chart.applyOptions({ width: rect.width, height: rect.height });
    draw();
  }).observe(chartContainer);

  chart.timeScale().subscribeVisibleLogicalRangeChange(draw);
  $('symbolSelect').value = currentSymbol;
  $('tfSelect').value = currentTF;
}

async function fetchUrl(targetUrl) {
  try { let res = await fetch(targetUrl); if (res.ok) return await res.json(); } catch(e) {}
  try { let res = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`); if (res.ok) return await res.json(); } catch(e) {}
  return null;
}

async function fetchMainData() {
  const result = await fetchUrl(`https://biquote.io/api/${currentSymbol}/ohlc?interval=${currentTF}&limit=300&t=${Date.now()}`);
  if (!result || !result.bars) return;

  const parsedData = result.bars.map(d => ({ time: Math.floor(new Date(d.openTime).getTime() / 1000), open: parseFloat(d.open), high: parseFloat(d.high), low: parseFloat(d.low), close: parseFloat(d.close) }));
  const uniqueData = []; const seenTimes = new Set();
  for(const item of parsedData) { if(!seenTimes.has(item.time) && !isNaN(item.time)) { seenTimes.add(item.time); uniqueData.push(item); } }
  currentData = uniqueData.sort((a, b) => a.time - b.time);
  
  candleSeries.setData(currentData);
  if (currentData.length > 0) { 
      currentPrice = currentData[currentData.length - 1].close; 
      currentTime = currentData[currentData.length - 1].time;
      if (currentTab === 'classic') analyzeSMCClassic();
      else analyzeOPR();
      draw();
  }
}

/* =========================================
   LOGIQUE SMC CLASSIQUE (Structure & Setup)
   ========================================= */
function analyzeSMCClassic() {
    if (currentData.length < 50) return;
    
    // 1. Mise à jour des badges MTF (Simplifié pour l'exemple)
    const ema = (arr) => arr.reduce((a, b) => a + b.close, 0) / arr.length;
    const isUp = currentPrice > ema(currentData.slice(-50));
    const cls = isUp ? 'up' : 'down';
    
    $('badge-current').className = `mtf-badge ${cls}`;
    $('badge-current').innerHTML = `<span>1m : ${isUp ? 'HAUSSE' : 'BAISSE'}</span>`;
    
    $('badge-htf1').className = `mtf-badge ${cls}`;
    $('badge-htf1').innerHTML = `<span>15m : ${isUp ? 'HAUSSE' : 'BAISSE'}</span>`;
    
    $('badge-htf2').className = `mtf-badge ${cls}`;
    $('badge-htf2').innerHTML = `<span>4h : ${isUp ? 'HAUSSE' : 'BAISSE'}</span>`;

    // 2. Détection de setup (Simulation basée sur la tendance pour l'exemple)
    // Dans un vrai bot, on chercherait ici un BOS/CHoCH + FVG
    const atr = currentPrice * 0.001; // approx
    
    if (isUp) {
        smcSetup = {
            type: 'buy',
            entry: currentPrice - (atr * 0.5),
            sl: currentPrice - (atr * 1.5),
            tp: currentPrice + (atr * 2.0),
            startTime: currentTime
        };
        $('tradeStatusClassic').className = 'status-progress';
        $('tradeStatusClassic').textContent = "🚀 Trade ACHAT actif";
    } else {
        smcSetup = {
            type: 'sell',
            entry: currentPrice + (atr * 0.5),
            sl: currentPrice + (atr * 1.5),
            tp: currentPrice - (atr * 2.0),
            startTime: currentTime
        };
        $('tradeStatusClassic').className = 'status-progress';
        $('tradeStatusClassic').textContent = "🚀 Trade VENTE actif";
    }
    
    // Affichage UI
    const s = smcSetup;
    $('analysisContentClassic').innerHTML = `
        <div class="setup-compact ${s.type}">
            <div class="sc-item"><span class="sc-label">Entrée</span><span class="sc-val entry">${fmt(s.entry)}</span></div>
            <div class="sc-item"><span class="sc-label">SL</span><span class="sc-val sl">${fmt(s.sl)}</span></div>
            <div class="sc-item"><span class="sc-label">TP</span><span class="sc-val tp">${fmt(s.tp)}</span></div>
        </div>
    `;
}

/* =========================================
   LOGIQUE OPR GOLD
   ========================================= */
function getNYTime(ts) {
    const d = new Date(ts * 1000);
    const nyString = d.toLocaleString("en-US", { timeZone: "America/New_York", hour12: false });
    const parts = nyString.split(", ")[1].split(":");
    return { h: parseInt(parts[0]), m: parseInt(parts[1]) };
}

function analyzeOPR() {
    if (currentData.length < 50) return;
    
    let oprH = -1, oprL = 999999;
    let asiaH = -1, asiaL = 999999;
    let lonH = -1, lonL = 999999;
    let startT = null, endT = null;
    
    const todayStr = new Date().toLocaleDateString("en-US", { timeZone: "America/New_York" });
    
    for (const bar of currentData) {
        const ny = getNYTime(bar.time);
        const barDayStr = new Date(bar.time * 1000).toLocaleDateString("en-US", { timeZone: "America/New_York" });
        if (barDayStr !== todayStr) continue; 
        
        if (ny.h >= 0 && ny.h < 6) { asiaH = Math.max(asiaH, bar.high); asiaL = Math.min(asiaL, bar.low); }
        if (ny.h >= 6 && (ny.h < 9 || (ny.h === 9 && ny.m < 30))) { lonH = Math.max(lonH, bar.high); lonL = Math.min(lonL, bar.low); }
        
        // Détection de la fenêtre OPR (09h30 - 09h45)
        if (ny.h === 9 && ny.m >= 30 && ny.m < 45) {
            if (startT === null) startT = bar.time;
            endT = bar.time;
            oprH = Math.max(oprH, bar.high); 
            oprL = Math.min(oprL, bar.low);
        }
    }
    
    oprState.levels = { oprH, oprL, asiaH, asiaL, lonH, lonL };
    oprState.startTime = startT;
    oprState.endTime = endT;
    
    const nowNY = getNYTime(currentTime);
    const isOPRReady = (nowNY.h > 9 || (nowNY.h === 9 && nowNY.m >= 45)) && oprH !== -1;
    
    if (isOPRReady) {
        const oprSize = oprH - oprL;
        let atrSum = 0;
        for (let i = currentData.length - 14; i < currentData.length; i++) atrSum += (currentData[i].high - currentData[i].low);
        const atr = atrSum / 14;
        
        oprState.valid = oprSize <= atr * 3.0;
        
        $('tradeStatusOPR').className = oprState.valid ? 'status-wait' : 'status-invalid';
        $('tradeStatusOPR').textContent = oprState.valid ? "🔍 OPR valide. Attente de sweep..." : "⚠️ OPR trop grand. Journée ignorée.";
        
        $('analysisContentOPR').innerHTML = `<div class="loading-text">${oprState.valid ? 'En attente de setup...' : 'Aucun trade'}</div>`;
    } else {
        $('tradeStatusOPR').className = 'status-wait';
        $('tradeStatusOPR').textContent = "⏳ Construction de l'OPR (09h30 - 09h45 NY)...";
    }
}

/* =========================================
   DESSIN SUR LE GRAPHIQUE
   ========================================= */
function draw() {
    const rect = $('chart').getBoundingClientRect();
    if (overlayCanvas.width !== rect.width || overlayCanvas.height !== rect.height) {
        overlayCanvas.width = rect.width; overlayCanvas.height = rect.height;
    }
    ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
    
    const X = t => chart.timeScale().timeToCoordinate(t);
    const Y = p => candleSeries.priceToCoordinate(p);

    if (currentTab === 'classic' && smcSetup) {
        const s = smcSetup;
        const xStart = X(s.startTime) || (overlayCanvas.width - 100);
        const xEnd = overlayCanvas.width;
        
        const yE = Y(s.entry), ySL = Y(s.sl), yTP = Y(s.tp);
        
        if (yE !== null && ySL !== null && yTP !== null) {
            // Zone TP (Vert)
            ctx.fillStyle = 'rgba(38,166,154,0.15)';
            ctx.strokeStyle = 'rgba(38,166,154,0.8)';
            ctx.lineWidth = 2;
            ctx.fillRect(xStart, Math.min(yE, yTP), xEnd - xStart, Math.abs(yE - yTP));
            ctx.strokeRect(xStart, Math.min(yE, yTP), xEnd - xStart, Math.abs(yE - yTP));
            
            // Zone SL (Rouge)
            ctx.fillStyle = 'rgba(239,83,80,0.15)';
            ctx.strokeStyle = 'rgba(239,83,80,0.8)';
            ctx.fillRect(xStart, Math.min(yE, ySL), xEnd - xStart, Math.abs(yE - ySL));
            ctx.strokeRect(xStart, Math.min(yE, ySL), xEnd - xStart, Math.abs(yE - ySL));
            
            // Ligne Entrée
            ctx.beginPath();
            ctx.setLineDash([5,5]);
            ctx.moveTo(xStart, yE); ctx.lineTo(xEnd, yE);
            ctx.strokeStyle = '#2962ff';
            ctx.stroke();
            ctx.setLineDash([]);
        }
    }
    
    if (currentTab === 'opr' && oprState.levels.oprH) {
        const drawLine = (price, color, label) => {
            const y = Y(price);
            if (y === null) return;
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(overlayCanvas.width, y); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = color;
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(label, 5, y - 5);
        };
        
        if(oprState.levels.asiaH) drawLine(oprState.levels.asiaH, '#2196f3', 'ASIA H');
        if(oprState.levels.asiaL) drawLine(oprState.levels.asiaL, '#2196f3', 'ASIA L');
        if(oprState.levels.lonH) drawLine(oprState.levels.lonH, '#9c27b0', 'LON H');
        if(oprState.levels.lonL) drawLine(oprState.levels.lonL, '#9c27b0', 'LON L');
        if(oprState.levels.oprH) drawLine(oprState.levels.oprH, '#ff9800', 'OPR H');
        if(oprState.levels.oprL) drawLine(oprState.levels.oprL, '#ff9800', 'OPR L');
        
        // DESSIN DU RECTANGLE OPR (Fenêtre de construction)
        if (oprState.startTime && oprState.endTime) {
            const xStart = X(oprState.startTime);
            const xEnd = X(oprState.endTime);
            const yH = Y(oprState.levels.oprH);
            const yL = Y(oprState.levels.oprL);
            
            if (xStart !== null && xEnd !== null && yH !== null && yL !== null) {
                ctx.fillStyle = 'rgba(255, 152, 0, 0.2)'; // Orange visible pour la construction
                ctx.fillRect(xStart, yH, xEnd - xStart, yL - yH);
                ctx.strokeStyle = 'rgba(255, 152, 0, 0.8)';
                ctx.strokeRect(xStart, yH, xEnd - xStart, yL - yH);
                
                // Label au dessus de la zone de construction
                ctx.fillStyle = '#ff9800';
                ctx.font = 'bold 11px sans-serif';
                ctx.fillText('Zone OPR', xStart, yH - 10);
            }
        }
    }
}

window.addEventListener('load', () => {
  initChart();
  fetchMainData();
  setInterval(fetchMainData, 5000);
  setInterval(draw, 250); // Redessine en continu pour suivre le scroll
});

$('symbolSelect').addEventListener('change', (e) => { 
    currentSymbol = e.target.value; localStorage.setItem('cv_symbol', currentSymbol); fetchMainData();
});
$('tfSelect').addEventListener('change', (e) => { 
    currentTF = e.target.value; localStorage.setItem('cv_tf', currentTF); fetchMainData();
});
</script>
</body>
</html>
