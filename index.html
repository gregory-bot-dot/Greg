<script type="module">
import { z } from 'https://esm.sh/zod@3.24.2';

// Runtime market-data validation: malformed, duplicated, or non-finite candles
// are rejected before reaching charting and strategy calculations.
const RawCandleSchema = z.object({
  openTime: z.union([z.number(), z.string()]),
  open: z.coerce.number().finite(),
  high: z.coerce.number().finite(),
  low: z.coerce.number().finite(),
  close: z.coerce.number().finite()
}).refine(c => c.high >= c.low && c.high >= c.open && c.high >= c.close && c.low <= c.open && c.low <= c.close, {
  message: 'OHLC candle has inconsistent price bounds'
});
