<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ChartVision Pro — SMC v2</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0b0e14;--p:#131722;--p2:#1a1f2c;--line:#2f3a52;--txt:#e8eef7;--mut:#8b94a8;--acc:#2962ff;--up:#26a69a;--dn:#ef5350;--warn:#ff9800}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:10px 15px;background:#0e1219;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:18px;margin:0;white-space:nowrap}h1 span{color:var(--acc)}
.controls{display:flex;gap:8px;flex:1;min-width:250px}
select{flex:1;background:var(--p2);border:1px solid var(--line);color:#fff;border-radius:6px;padding:8px;font-size:13px;font-weight:600}
.app{display:flex;flex:1;overflow:hidden}
@media(max-width:900px){.app{flex-direction:column}}
.cc{flex:1;position:relative;background:#05080c;min-height:300px}
#chart,#ov{position:absolute;inset:0}#ov{width:100%;height:100%;pointer-events:none;z-index:2}
.panel{width:340px;background:var(--p);border-left:1px solid var(--line);overflow-y:auto}
@media(max-width:900px){.panel{width:100%;height:60vh;border-left:0;border-top:1px solid var(--line)}}
.mtf{display:flex;gap:6px;padding:10px 15px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.2)}
.bd{flex:1;text-align:center;padding:6px;border-radius:6px;font-size:11px;font-weight:700;border:1px solid var(--line);background:var(--p2);color:var(--mut);display:flex;flex-direction:column;align-items:center}
.bd.up{border-color:var(--up);color:var(--up);background:rgba(38,166,154,.1)}.bd.down{border-color:var(--dn);color:var(--dn);background:rgba(239,83,80,.1)}
.bd small{font-size:9px;opacity:.85;margin-top:2px}
#status{padding:12px 15px;font-weight:700;font-size:13px;text-align:center;border-bottom:1px solid var(--line)}
.wait{background:rgba(255,152,0,.15);color:var(--warn)}.prog{background:rgba(38,166,154,.15);color:var(--up)}.conf{background:rgba(156,39,176,.2);color:#e1bee7}
.box{padding:10px 15px;border-bottom:1px solid var(--line)}
.t{font-size:10px;color:var(--mut);text-transform:uppercase;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:11px}.yes{color:var(--up)}.no{color:var(--mut);opacity:.6}
.stats{display:flex;justify-content:space-between;font-size:12px}.stats b{display:block;font-family:monospace;font-size:14px}
.setup{display:flex;justify-content:space-between;padding:12px 15px;border-bottom:1px solid var(--line)}
.setup.buy{background:rgba(38,166,154,.06);border-left:4px solid var(--up)}.setup.sell{background:rgba(239,83,80,.06);border-left:4px solid var(--dn)}
.setup div{text-align:center}.setup small{display:block;font-size:9px;color:var(--mut);text-transform:uppercase;margin-bottom:4px}.setup b{font-family:monospace;font-size:14px}
.ji{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;margin:0 15px 6px;background:var(--p2);border-radius:6px;border-left:3px solid var(--mut);font-size:11px}
.ji.win{border-color:var(--up)}.ji.loss{border-color:var(--dn)}.ji span{color:var(--mut);font-family:monospace}
button{background:transparent;border:1px solid var(--line);color:var(--mut);font-size:10px;padding:3px 7px;border-radius:4px;cursor:pointer}
.note{padding:10px 15px;font-size:10px;color:var(--mut);line-height:1.4}
</style></head><body>
<header><h1>Chart<span>Vision</span></h1>
<div class="controls">
<select id="sym"><option value="XAUUSD">🥇 XAU/USD</option><option value="BTCUSD">₿ BTC/USD</option><option value="EURUSD">🇪🇺 EUR/USD</option><option value="US500">🇺🇸 S&amp;P 500</option></select>
<select id="tf"><option>1m</option><option>5m</option><option>15m</option><option>1h</option><option>4h</option><option value="1d">1D</option></select>
<select id="min"><option value="2">Score ≥ 2</option><option value="3">Score ≥ 3</option><option value="4">Score ≥ 4</option><option value="5">Score 5</option></select>
</div></header>
<div class="app">
<div class="cc"><div id="chart"></div><canvas id="ov"></canvas></div>
<div class="panel">
<div class="mtf"><div class="bd" id="b0">…</div><div class="bd" id="b1">…</div><div class="bd" id="b2">…</div></div>
<div id="status" class="wait">Chargement…</div>
<div class="box" id="conf"></div>
<div class="box" id="stats"></div>
<div id="trade"></div>
<div class="box"><div class="t"><span>Journal (10 derniers)</span><button id="hist">Masquer lignes</button></div></div>
<div id="journal"></div>
<div class="note">Outil d’analyse, pas un conseil financier. Stats = rejeu sur les bougies chargées : entrée à 50 % de l’OB, R:R 2, SL prioritaire si SL et TP sont touchés dans la même bougie.</div>
</div></div>
<script>
const $=id=>document.getElementById(id);
const ls=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const S={sym:ls('cv_symbol','XAUUSD'),tf:ls('cv_tf','1m'),min:+ls('cv_min',3)};
const HTF={'1m':['15m','4h'],'5m':['15m','4h'],'15m':['1h','4h'],'1h':['4h','1d'],'4h':['1d',null],'1d':[null,null]};
const MAXWAIT=40; // bougies max avant expiration d'un ordre en attente
let chart,series,ctx,data=[],res=null,htf={h1:null,h2:null},showHist=true;
const dec=()=>S.sym==='XAUUSD'?2:S.sym==='EURUSD'?5:1;
const fmt=p=>p.toLocaleString('fr-FR',{minimumFractionDigits:dec(),maximumFractionDigits:dec()});

/* ---------- données ---------- */
async function fetchUrl(u){
  for(const x of [u,'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)]){
    try{const r=await fetch(x);if(r.ok)return await r.json()}catch(e){}
  }return null;
}
const getBars=(tf,n)=>fetchUrl(`https://biquote.io/api/${S.sym}/ohlc?interval=${tf}&limit=${n}&t=${Date.now()}`);
function parse(b){
  const m=new Map();
  b.forEach(x=>{const t=Math.floor(new Date(x.openTime).getTime()/1000);
    if(!isNaN(t))m.set(t,{time:t,open:+x.open,high:+x.high,low:+x.low,close:+x.close})});
  return[...m.values()].sort((a,b)=>a.time-b.time);
}

/* ---------- moteur SMC ---------- */
function atrArr(d){
  const t=d.map((c,i)=>i?Math.max(c.high-c.low,Math.abs(c.high-d[i-1].close),Math.abs(c.low-d[i-1].close)):c.high-c.low);
  let s=0;return t.map((v,i)=>{s+=v;if(i>=14)s-=t[i-14];return s/Math.min(i+1,14)});
}
// Swings confirmés (3 bougies de chaque côté), BOS / CHoCH sur clôture, OB = dernière bougie opposée avant l'impulsion
function structure(d){
  const L=3,A=atrArr(d),ev=[];let hi=null,lo=null,pH=null,pL=null,trend=0;
  for(let i=0;i<d.length;i++){
    const p=i-L;
    if(p>=L){
      let H=1,W=1;
      for(let k=1;k<=L;k++){
        if(d[p].high<=d[p-k].high||d[p].high<=d[p+k].high)H=0;
        if(d[p].low>=d[p-k].low||d[p].low>=d[p+k].low)W=0;
      }
      if(H){hi={i:p,price:d[p].high,sweep:pH!==null&&d[p].high>pH,done:false};pH=d[p].high}
      if(W){lo={i:p,price:d[p].low,sweep:pL!==null&&d[p].low<pL,done:false};pL=d[p].low}
    }
    const c=d[i];let dir=0,org=null;
    if(hi&&!hi.done&&c.close>hi.price){dir=1;hi.done=true;org=lo}
    else if(lo&&!lo.done&&c.close<lo.price){dir=-1;lo.done=true;org=hi}
    if(!dir)continue;
    const type=trend===-dir?'CHoCH':'BOS';trend=dir;
    const e={idx:i,time:c.time,dir,type,ob:null,score:0,atr:A[i]};
    if(org){
      let k=-1;
      for(let j=i-1;j>=org.i;j--){const q=d[j];if(dir>0?q.close<q.open:q.close>q.open){k=j;break}}
      if(k>=0){
        let disp=false,fvg=false;
        for(let j=Math.max(k+1,i-2);j<=i;j++){const q=d[j],b=Math.abs(q.close-q.open);if(b>A[i]*1.2&&b>(q.high-q.low)*.6)disp=true}
        for(let j=k;j<=i-2;j++)if(dir>0?d[j+2].low>d[j].high:d[j+2].high<d[j].low)fvg=true;
        const h=new Date(c.time*1000).getUTCHours();
        e.c=[type==='CHoCH',disp,fvg,org.sweep,h>=7&&h<=16];
        e.score=e.c.filter(Boolean).length;
        e.ob={top:d[k].high,bottom:d[k].low,time:d[k].time};
      }
    }
    ev.push(e);
  }
  return{trend,ev};
}
// Cycle de vie : pending → filled → TP/SL (ou cancel / missed). Un seul trade à la fois.
function runTrades(d,evs,min){
  const n=d.length,out=[],at={};let free=-1;
  evs.forEach(e=>at[e.idx]=e);
  for(const e of evs){
    if(e.idx<=free||!e.ob||e.score<min)continue;
    const buy=e.dir>0,pad=e.atr*.15,entry=(e.ob.top+e.ob.bottom)/2;
    const sl=buy?e.ob.bottom-pad:e.ob.top+pad,risk=Math.abs(entry-sl);
    if(risk<=0)continue;
    const tp=buy?entry+2*risk:entry-2*risk;
    const t={...e,type:buy?'buy':'sell',entry,sl,tp,status:'pending',fill:null,end:null};
    for(let j=e.idx+1;j<n;j++){
      const c=d[j],hitSL=buy?c.low<=sl:c.high>=sl,hitTP=buy?c.high>=tp:c.low<=tp;
      if(t.status==='pending'){
        if((at[j]&&at[j].dir!==e.dir)||j-e.idx>MAXWAIT){t.status='cancel';t.end=j;break}
        const touch=buy?c.low<=entry:c.high>=entry;
        if(!touch){if(hitTP){t.status='missed';t.end=j;break}continue}
        t.fill=j;
        if(hitSL){t.status='SL';t.end=j;break}
        t.status='filled';
      }else{
        if(hitSL){t.status='SL';t.end=j;break}
        if(hitTP){t.status='TP';t.end=j;break}
      }
    }
    out.push(t);
    if(t.status==='pending'||t.status==='filled')break;
    free=t.end;
  }
  return out;
}
function fvgList(d){
  const o=[];
  for(let i=Math.max(0,d.length-40);i<d.length-2;i++){
    let g=null;
    if(d[i+2].low>d[i].high)g={top:d[i+2].low,bottom:d[i].high,up:1};
    else if(d[i+2].high<d[i].low)g={top:d[i].low,bottom:d[i+2].high,up:0};
    if(!g)continue;
    let filled=false;
    for(let j=i+3;j<d.length;j++)if(g.up?d[j].low<=g.bottom:d[j].high>=g.top){filled=true;break}
    if(!filled){g.time=d[i].time;o.push(g)}
  }
  return o.slice(-3);
}

/* ---------- analyse + rendu ---------- */
function update(){
  if(data.length<40)return;
  const closed=data.slice(0,-1),st=structure(closed),trades=runTrades(data,st.ev,S.min);
  const open=trades.find(t=>t.status==='pending'||t.status==='filled');
  const done=trades.filter(t=>t.status==='TP'||t.status==='SL');
  res={st,trades,open,done,fvg:fvgList(closed)};
  series.setMarkers(st.ev.slice(-10).map(e=>({time:e.time,position:e.dir>0?'belowBar':'aboveBar',
    color:e.type==='CHoCH'?'#ff9800':'#8b94a8',shape:e.dir>0?'arrowUp':'arrowDown',text:e.type})));
  badge('b0',S.tf,st);render();draw();
}
function badge(id,label,st){
  const el=$(id),cls=st.trend>0?'up':st.trend<0?'down':'',l=st.ev[st.ev.length-1];
  el.className='bd '+cls;
  el.innerHTML=`<span>${label} : ${st.trend>0?'HAUSSE':st.trend<0?'BAISSE':'—'}</span><small>${l?l.type+(l.dir>0?' ▲':' ▼'):''}</small>`;
}
function render(){
  const{st,open,done}=res,price=data[data.length-1].close;
  const hs=[htf.h1,htf.h2].filter(Boolean);
  let cls='wait',txt;
  if(!open)txt=`🔍 Aucun setup (score ≥ ${S.min})`;
  else{
    const dir=open.dir,al=hs.length&&hs.every(h=>h.trend===dir),cf=hs.some(h=>h.trend===-dir);
    const tag=al?' · 🔥 MTF aligné':cf?' · ⚠️ conflit MTF':'';
    if(open.status==='filled'){
      const r=(price-open.entry)*dir/Math.abs(open.entry-open.sl);
      txt=`🚀 En cours (${r>=0?'+':''}${r.toFixed(2)} R)`+tag;cls=al?'conf':'prog';
    }else{
      txt=(Math.abs(price-open.entry)<=price*.0002?'🎯 Prix dans la zone d’entrée':`⏳ Ordre en attente : retour vers ${fmt(open.entry)}`)+tag;
    }
  }
  $('status').className=cls;$('status').textContent=txt;

  const ref=open||[...st.ev].reverse().find(e=>e.ob),names=['CHoCH','Displacement','FVG','Sweep liquidité','Session'];
  $('conf').innerHTML=ref?`<div class="t"><span>${open?'Setup actif':'Dernier signal rejeté'} · ${ref.type}</span><b style="color:var(--acc);font-size:14px">${ref.score}/5</b></div>
    <div class="grid">${names.map((n,i)=>`<div class="${ref.c[i]?'yes':'no'}">${ref.c[i]?'✔':'✖'} ${n}</div>`).join('')}</div>`:'<div class="t">Aucune structure détectée</div>';

  const w=done.filter(t=>t.status==='TP').length,l=done.length-w,R=w*2-l;
  $('stats').innerHTML=`<div class="t"><span>Rejeu (score ≥ ${S.min})</span></div><div class="stats">
    <div>Trades<b>${done.length}</b></div><div>Winrate<b>${done.length?Math.round(w/done.length*100)+'%':'—'}</b></div>
    <div>Résultat<b style="color:var(--${R>=0?'up':'dn'})">${R>=0?'+':''}${R} R</b></div></div>`;

  $('trade').innerHTML=open?`<div class="setup ${open.type}"><div><small>Entrée</small><b style="color:var(--acc)">${fmt(open.entry)}</b></div>
    <div><small>SL</small><b style="color:var(--dn)">${fmt(open.sl)}</b></div><div><small>TP (R:R 2)</small><b style="color:var(--up)">${fmt(open.tp)}</b></div></div>`:'';

  $('journal').innerHTML=done.length?done.slice(-10).reverse().map(t=>{
    const win=t.status==='TP',tm=new Date(data[t.end].time*1000).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    return`<div class="ji ${win?'win':'loss'}"><div><b style="color:var(--${win?'up':'dn'})">${t.type==='buy'?'🟢 ACHAT':'🔴 VENTE'}</b><br><small style="color:var(--mut)">${tm}</small></div>
      <span>E ${fmt(t.entry)}</span><b style="color:var(--${win?'up':'dn'})">${win?'+2R ✅':'-1R ❌'}</b></div>`}).join(''):'<div class="note">Aucun trade dans l’historique chargé.</div>';
}
function draw(){
  const ov=$('ov'),r=$('chart').getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  if(ov.width!==Math.round(r.width*dpr)||ov.height!==Math.round(r.height*dpr)){ov.width=Math.round(r.width*dpr);ov.height=Math.round(r.height*dpr)}
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,r.width,r.height);
  if(!res)return;
  const W=r.width,X=t=>{const x=chart.timeScale().timeToCoordinate(t);return x===null?0:x},Y=p=>series.priceToCoordinate(p);
  const box=(x1,x2,a,b,fill,line)=>{const ya=Y(a),yb=Y(b);if(ya===null||yb===null||x2<=x1)return;
    ctx.fillStyle=fill;ctx.strokeStyle=line;ctx.fillRect(x1,Math.min(ya,yb),x2-x1,Math.abs(ya-yb));ctx.strokeRect(x1,Math.min(ya,yb),x2-x1,Math.abs(ya-yb))};
  ctx.lineWidth=1;ctx.setLineDash([3,3]);
  res.fvg.forEach(g=>box(X(g.time),W,g.top,g.bottom,'rgba(156,39,176,.05)','rgba(156,39,176,.4)'));
  const draws=(t,x2,a)=>{const x1=X(t.time);
    box(x1,x2,t.entry,t.tp,`rgba(38,166,154,${a*.15})`,`rgba(38,166,154,${a})`);
    box(x1,x2,t.entry,t.sl,`rgba(239,83,80,${a*.15})`,`rgba(239,83,80,${a})`)};
  if(showHist)res.done.slice(-10).forEach(t=>draws(t,Math.max(X(data[t.end].time),X(t.time)+2),.25));
  const o=res.open;
  if(o){
    ctx.lineWidth=2;ctx.setLineDash([]);draws(o,W,.8);
    const y=Y(o.entry),ytp=Y(o.tp),ysl=Y(o.sl);
    if(y!==null){ctx.setLineDash([5,5]);ctx.strokeStyle='#2962ff';ctx.beginPath();ctx.moveTo(X(o.time),y);ctx.lineTo(W,y);ctx.stroke();ctx.setLineDash([])}
    ctx.font='bold 10px sans-serif';ctx.textAlign='right';
    if(ytp!==null){ctx.fillStyle='#26a69a';ctx.fillText('TP',W-5,ytp+(o.dir>0?-5:12))}
    if(ysl!==null){ctx.fillStyle='#ef5350';ctx.fillText('SL',W-5,ysl+(o.dir>0?12:-5))}
    if(y!==null){ctx.fillStyle='#2962ff';ctx.fillText('ENTRÉE',W-5,y-5)}
  }
  ctx.setLineDash([]);
}

/* ---------- chargement ---------- */
async function loadMain(){
  const r=await getBars(S.tf,200);
  if(!r||!r.bars||!r.bars.length){if(!data.length)$('status').textContent='Données indisponibles';return}
  data=parse(r.bars);series.setData(data);update();
}
async function loadHTF(){
  const[a,b]=HTF[S.tf];
  for(const[k,tf,id]of[['h1',a,'b1'],['h2',b,'b2']]){
    if(!tf){htf[k]=null;$(id).className='bd';$(id).innerHTML='<span>—</span>';continue}
    const r=await getBars(tf,100);
    if(r&&r.bars){const d=parse(r.bars);htf[k]=structure(d.slice(0,-1));badge(id,tf,htf[k])}
  }
  if(res)render();
}
function reset(){data=[];res=null;htf={h1:null,h2:null};series.setData([]);series.setMarkers([]);
  ['b0','b1','b2'].forEach(i=>{$(i).className='bd';$(i).innerHTML='…'});
  $('status').className='wait';$('status').textContent='Chargement…';draw();loadMain();loadHTF()}

window.addEventListener('load',()=>{
  const el=$('chart');
  chart=LightweightCharts.createChart(el,{
    layout:{background:{type:'solid',color:'#05080c'},textColor:'#d1d4dc'},
    grid:{vertLines:{color:'#1a1f2c'},horzLines:{color:'#1a1f2c'}},
    rightPriceScale:{borderColor:'#2f3a52'},timeScale:{borderColor:'#2f3a52',timeVisible:true,secondsVisible:false}});
  series=chart.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
  ctx=$('ov').getContext('2d');
  new ResizeObserver(e=>{const r=e[0].contentRect;chart.applyOptions({width:r.width,height:r.height});draw()}).observe(el);
  chart.timeScale().subscribeVisibleLogicalRangeChange(draw);
  setInterval(draw,250); // suit aussi le zoom/déplacement vertical
  $('sym').value=S.sym;$('tf').value=S.tf;$('min').value=S.min;
  loadMain();loadHTF();setInterval(loadMain,5000);setInterval(loadHTF,60000);
});
$('sym').onchange=e=>{S.sym=e.target.value;sv('cv_symbol',S.sym);reset()};
$('tf').onchange=e=>{S.tf=e.target.value;sv('cv_tf',S.tf);reset()};
$('min').onchange=e=>{S.min=+e.target.value;sv('cv_min',S.min);update()};
$('hist').onclick=()=>{showHist=!showHist;$('hist').textContent=showHist?'Masquer lignes':'Afficher lignes';draw()};
</script></body></html>
