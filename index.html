<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ChartVision Pro — Multi-Stratégies v2</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0b0e14;--panel:#131722;--panel2:#1a1f2c;--line:#2f3a52;--txt:#e8eef7;--muted:#8b94a8;--acc:#2962ff;--up:#26a69a;--down:#ef5350;--warn:#ff9800}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:8px 12px;background:#0e1219;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap}
header h1 span{color:var(--acc)}
.controls{display:flex;gap:6px;flex:1;min-width:220px;align-items:center}
select{flex:1;background:var(--panel2);border:1px solid var(--line);color:#fff;border-radius:6px;padding:7px 8px;font-size:12px;font-family:inherit;outline:none;font-weight:600}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:7px 10px;font-size:12px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:#fff}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.status-bar{display:flex;gap:12px;align-items:center;font-size:11px;color:var(--muted);padding:0 4px;flex-wrap:wrap}
.status-bar .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.dot.ok{background:var(--up)}.dot.warn{background:var(--warn)}.dot.err{background:var(--down)}
.app{display:flex;flex:1;overflow:hidden;position:relative}
@media(max-width:900px){.app{flex-direction:column}}
.chart-container{flex:1;position:relative;background:#05080c;min-height:280px}
#chart{position:absolute;inset:0;z-index:1}
#overlayCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.panel{width:360px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
@media(max-width:900px){.panel{width:100%;height:60vh;border-left:none;border-top:1px solid var(--line)}}
.tabs{display:flex;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line);background:#0e1219;position:sticky;top:0;z-index:10;flex:0 0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:11px 14px;text-align:center;font-size:11px;font-weight:bold;color:var(--muted);cursor:pointer;text-transform:uppercase;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--acc);border-bottom-color:var(--acc);background:var(--panel)}
.mtf-row{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.2)}
.mtf-badge{flex:1;text-align:center;padding:6px;border-radius:6px;font-size:11px;font-weight:bold;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}
.mtf-badge.up{border-color:var(--up);color:var(--up);background:rgba(38,166,154,.1)}
.mtf-badge.down{border-color:var(--down);color:var(--down);background:rgba(239,83,80,.1)}
.status{padding:11px 12px;font-weight:bold;font-size:13px;text-align:center;border-bottom:1px solid var(--line)}
.status-wait{background:rgba(255,152,0,.15);color:var(--warn)}
.status-progress{background:rgba(38,166,154,.15);color:var(--up)}
.status-invalid{background:rgba(239,83,80,.15);color:var(--down)}
.panel-header{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:bold;text-transform:uppercase;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.setup-compact{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line)}
.setup-compact.buy{background:rgba(38,166,154,.05);border-left:4px solid var(--up)}
.setup-compact.sell{background:rgba(239,83,80,.05);border-left:4px solid var(--down)}
.sc-item{text-align:center}
.sc-label{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.sc-val{font-family:monospace;font-size:13px;font-weight:bold}
.sc-val.entry{color:var(--acc)}.sc-val.sl{color:var(--down)}.sc-val.tp{color:var(--up)}
.opr-legend{padding:8px 12px;font-size:11px;display:flex;gap:8px;background:rgba(0,0,0,.1)}
.leg-color{width:10px;height:10px;border-radius:2px;background:#ff9800;display:inline-block;margin-right:4px}
.set{padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:var(--muted)}
.set input[type=number]{width:100%;background:var(--panel2);border:1px solid var(--line);color:#fff;border-radius:4px;padding:5px}
.set button{grid-column:1/-1;padding:10px;background:var(--acc);border:0;color:#fff;border-radius:6px;font-weight:700;cursor:pointer}
.ck{display:flex;gap:6px;align-items:center}
table.bt{width:100%;border-collapse:collapse;font-size:12px}
.bt td,.bt th{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line)}
.bt td:first-child,.bt th:first-child{text-align:left}
.loading-text{padding:16px 12px;text-align:center;color:var(--muted);font-size:12px;line-height:1.45}
.pnl-bar{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.25);font-size:12px;align-items:center;justify-content:space-between}
.pnl-val{font-weight:700;font-family:monospace}
.pnl-val.pos{color:var(--up)}.pnl-val.neg{color:var(--down)}
.log-box{max-height:110px;overflow-y:auto;font-size:11px;padding:6px 12px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.15)}
.log-item{padding:3px 0;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.04)}
.log-item b{color:var(--txt)}
.err-banner{background:rgba(239,83,80,.2);color:var(--down);padding:8px 12px;font-size:12px;text-align:center;display:none}
#errBanner.show{display:block}
</style>
</head>
<body>
<header>
  <h1>Chart<span>Vision</span> <small style="font-size:11px;color:var(--muted);font-weight:500">v2</small></h1>
  <div class="controls">
    <select id="symbolSelect">
      <option value="XAUUSD">🥇 XAU/USD</option>
      <option value="BTCUSD">₿ BTC/USD</option>
      <option value="EURUSD">🇪🇺 EUR/USD</option>
      <option value="US500">🇺🇸 US S&P 500</option>
    </select>
    <select id="tfSelect">
      <option value="1m">1m</option>
      <option value="5m">5m</option>
      <option value="15m">15m</option>
      <option value="1h">1h</option>
      <option value="4h">4h</option>
      <option value="1d">1D</option>
    </select>
    <button class="btn" id="btnRefresh" title="Forcer le rafraîchissement">↻</button>
  </div>
  <div class="status-bar" id="statusBar">
    <span><span class="dot warn" id="connDot"></span><span id="connTxt">Connexion…</span></span>
    <span id="lastUpdate">—</span>
    <span id="barCount">—</span>
  </div>
</header>
<div class="err-banner" id="errBanner"></div>
<div class="app">
  <div class="chart-container" id="chartContainer">
    <div id="chart"></div>
    <canvas id="overlayCanvas"></canvas>
  </div>
  <div class="panel">
    <div class="pnl-bar" id="pnlBar">
      <span>PnL jour</span>
      <span class="pnl-val" id="dayPnl">0.00 R</span>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="panel-header" id="btHead" style="cursor:pointer">📊 Backtest & réglages ▾</div>
    <div id="btBox" style="display:none"></div>
    <div id="conf" class="loading-text" style="padding:8px 12px"></div>
    <div id="secs"></div>
    <div id="empty" class="loading-text" style="display:none">Active au moins une stratégie</div>
    <div class="panel-header">Journal récent</div>
    <div class="log-box" id="logBox"><div class="loading-text" style="padding:8px">Aucun événement</div></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const STRATS = {
  smc: 'SMC Classique',
  opr: 'OPR Gold',
  ema: '📈 EMA Cross',
  bb: '📊 Bollinger+RSI',
  asia: '🌏 Asian Breakout',
  corys: '⚡ Corys Buy/Sell'
};

let chart, candle, lines = {};
let data = [], price = 0, now = 0, cur = 'smc', maxLim = 5000, cy = null;
let on = new Set(JSON.parse(localStorage.getItem('cv_on') || '["smc"]'));
let sym = localStorage.getItem('cv_symbol') || 'XAUUSD';
let tf = localStorage.getItem('cv_tf') || '1m';
let states = {}, hint = '', asiaR = null;
let htf = { t: 0, k: '', v: [null, null] };
let oprState = { levels: { oprH: null, oprL: null }, startTime: null, endTime: null, valid: false };
let seqStarted = 0, seqApplied = 0;
let lastFetchOk = false, lastFetchTs = 0, fetchErrors = 0;
const cv = $('overlayCanvas'), ctx = cv.getContext('2d');
const LOG = []; // journal d'événements

/* ---------- utilitaires ---------- */
function dec(s) {
  if (s.includes('JPY')) return 3;
  if (s === 'XAUUSD') return 2;
  if (s === 'BTCUSD' || s === 'US500' || s === 'US100') return 1;
  return 5;
}
const fmt = p => p.toLocaleString('fr-FR', { minimumFractionDigits: dec(sym), maximumFractionDigits: dec(sym) });

function loadStates() {
  try { states = JSON.parse(localStorage.getItem('cv_st_' + sym) || '{}'); }
  catch (e) { states = {}; }
}
function saveStates() {
  try { localStorage.setItem('cv_st_' + sym, JSON.stringify(states)); }
  catch (e) {}
}

function setStatus(c, t) {
  const e = $('st-' + cur);
  if (e) { e.className = 'status status-' + c; e.textContent = t; }
}

const fmtP = new Intl.DateTimeFormat('en-GB', {
  timeZone: 'Europe/Paris', hourCycle: 'h23',
  year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric'
});
const offC = new Map();

function loc(ts) {
  const k = Math.floor(ts / 3600);
  let v = offC.get(k);
  if (v === undefined) {
    const p = fmtP.formatToParts(new Date(ts * 1000));
    const g = t => +p.find(x => x.type === t).value;
    v = (Date.UTC(g('year'), g('month') - 1, g('day'), g('hour'), g('minute')) / 1000 - Math.floor(ts / 60) * 60) / 3600;
    offC.set(k, v);
  }
  return ts + v * 3600;
}

function log(msg, type = 'info') {
  const time = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  LOG.unshift({ t: time, msg, type });
  if (LOG.length > 40) LOG.pop();
  renderLog();
}

function renderLog() {
  const box = $('logBox');
  if (!LOG.length) {
    box.innerHTML = '<div class="loading-text" style="padding:8px">Aucun événement</div>';
    return;
  }
  box.innerHTML = LOG.slice(0, 12).map(l =>
    `<div class="log-item"><b>${l.t}</b> — ${l.msg}</div>`
  ).join('');
}

function updateStatusBar() {
  const dot = $('connDot'), txt = $('connTxt');
  if (lastFetchOk) {
    dot.className = 'dot ok';
    txt.textContent = 'Connecté';
  } else if (fetchErrors > 0) {
    dot.className = 'dot err';
    txt.textContent = 'Erreur API';
  } else {
    dot.className = 'dot warn';
    txt.textContent = 'Connexion…';
  }
  $('lastUpdate').textContent = lastFetchTs
    ? 'Maj ' + new Date(lastFetchTs).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
    : '—';
  $('barCount').textContent = data.length ? data.length + ' bougies' : '—';
}

function updateDayPnl() {
  const dy = Math.floor(loc(now || Date.now() / 1000) / 86400);
  const v = (states.pnl || {})[dy] || 0;
  const el = $('dayPnl');
  el.textContent = (v >= 0 ? '+' : '') + v.toFixed(2) + ' R';
  el.className = 'pnl-val ' + (v > 0 ? 'pos' : v < 0 ? 'neg' : '');
}

/* ---------- indicateurs ---------- */
function emaArr(v, n) {
  const o = Array(v.length).fill(null);
  if (v.length < n) return o;
  let e = v.slice(0, n).reduce((a, b) => a + b) / n;
  o[n - 1] = e;
  const k = 2 / (n + 1);
  for (let i = n; i < v.length; i++) {
    e = v[i] * k + e * (1 - k);
    o[i] = e;
  }
  return o;
}

function boll(v, n = 20, k = 2) {
  const m = [], u = [], l = [];
  for (let i = 0; i < v.length; i++) {
    if (i < n - 1) { m.push(null); u.push(null); l.push(null); continue; }
    let s = 0;
    for (let j = i - n + 1; j <= i; j++) s += v[j];
    const a = s / n;
    let q = 0;
    for (let j = i - n + 1; j <= i; j++) q += (v[j] - a) ** 2;
    const sd = Math.sqrt(q / n);
    m.push(a); u.push(a + k * sd); l.push(a - k * sd);
  }
  return { m, u, l };
}

function rsiArr(v, n = 14) {
  const o = Array(v.length).fill(null);
  if (v.length <= n) return o;
  let g = 0, l = 0;
  for (let i = 1; i <= n; i++) {
    const d = v[i] - v[i - 1];
    d > 0 ? g += d : l -= d;
  }
  g /= n; l /= n;
  o[n] = 100 - 100 / (1 + (l ? g / l : 1e9));
  for (let i = n + 1; i < v.length; i++) {
    const d = v[i] - v[i - 1];
    g = (g * (n - 1) + Math.max(d, 0)) / n;
    l = (l * (n - 1) + Math.max(-d, 0)) / n;
    o[i] = 100 - 100 / (1 + (l ? g / l : 1e9));
  }
  return o;
}

function atrAt(d, i, n = 14) {
  let s = 0, c = 0;
  for (let j = Math.max(1, i - n + 1); j <= i; j++) {
    const p = d[j - 1].close;
    s += Math.max(d[j].high - d[j].low, Math.abs(d[j].high - p), Math.abs(d[j].low - p));
    c++;
  }
  return c ? s / c : 0;
}

/* ---------- moteur de trades ---------- */
const mk = (type, entry, sl, tp, t0, id, market, label) => ({ type, entry, sl, tp, t0, id, market, label });

let SET = Object.assign({
  cap: 10000, risk: 1, dl: 3,
  trend: false, adx: false, sess: false, vol: false,
  be: false, partial: false, trail: false, retest: false,
  smcq: false, dll: true, soft: true
}, JSON.parse(localStorage.getItem('cv_set') || '{}'));

function idxOf(t) {
  let lo = 0, hi = data.length - 1;
  while (lo < hi) {
    const m = (lo + hi) >> 1;
    if (data[m].time < t) lo = m + 1; else hi = m;
  }
  return lo;
}

function evalSetup(s) {
  const b = s.type === 'buy', d = b ? 1 : -1, risk = Math.abs(s.entry - s.sl);
  let act = !!s.market, sl = s.sl, arm = false, bk = 0, rem = 1, n = 0;
  const R = p => bk + rem * (p - s.entry) * d / risk;
  for (let i = idxOf(s.t0); i < data.length; i++) {
    const c = data[i];
    if (c.time <= s.t0) continue;
    n++;
    if (!act && (b ? c.low <= s.entry : c.high >= s.entry)) act = true;
    if (act) {
      if (b ? c.low <= sl : c.high >= sl) return { st: arm ? 'be' : 'sl', i, R: R(sl) };
      if (b ? c.high >= s.tp : c.low <= s.tp) return { st: 'tp', i, R: R(s.tp) };
      if ((SET.be || SET.partial || SET.trail) && !arm && (b ? c.high >= s.entry + risk : c.low <= s.entry - risk)) {
        arm = true;
        sl = s.entry;
        if (SET.partial) { bk = 0.5; rem = 0.5; }
      }
      if (SET.trail && arm) sl = b ? Math.max(sl, c.high - risk) : Math.min(sl, c.low + risk);
    } else if (n > 40) return { st: 'cancel', i };
  }
  return { st: act ? 'active' : 'pending' };
}

function manage(key, detect) {
  cur = key;
  const st = states[key] || (states[key] = { done: [], msg: '' });
  hint = 'Aucun signal';

  if (!st.setup) {
    const s = detect(st.done);
    if (s) {
      st.done.push(s.id);
      st.done = st.done.slice(-40);
      const why = dayLimit() || (SET.soft ? null : filt(key, s));
      if (why) {
        st.msg = '🚫 Signal filtré : ' + why;
        log(`${STRATS[key]} filtré → ${why}`, 'filter');
      } else {
        st.setup = s;
        st.msg = '';
        if (SET.soft) {
          const w = filt(key, s);
          if (w) s.warn = w;
        }
        log(`${STRATS[key]} → ${s.type.toUpperCase()} ${s.label}`, 'signal');
      }
    }
  }

  if (st.setup) {
    const r = evalSetup(st.setup);
    if (r.st !== 'active' && r.st !== 'pending') {
      const labels = {
        tp: '🎯 TP atteint !',
        sl: '🛑 SL touché',
        be: '⚖️ Sorti à ' + (r.R || 0).toFixed(2) + ' R',
        cancel: '⌛ Ordre expiré'
      };
      st.msg = labels[r.st];
      log(`${STRATS[key]} ${labels[r.st]}`, r.st);
      if (r.R !== undefined) {
        const dy = Math.floor(loc(now) / 86400);
        const P = states.pnl || (states.pnl = {});
        P[dy] = (P[dy] || 0) + r.R;
        updateDayPnl();
      }
      st.setup = null;
      st.live = null;
      saveStates();
    } else {
      st.live = r.st;
      saveStates();
      renderSetup(key);
      return;
    }
  }
  setStatus(st.msg.includes('SL') ? 'invalid' : 'wait', st.msg || '🔍 Recherche de signal…');
  const ct = $('ct-' + cur);
  if (ct) ct.innerHTML = `<div class="loading-text">${hint}</div>`;
}

function renderSetup(key) {
  const st = states[key], s = st.setup, b = s.type === 'buy';
  const risk = Math.abs(s.entry - s.sl);
  const rr = Math.abs(s.tp - s.entry) / risk;

  if (st.live === 'active') {
    const R = (b ? price - s.entry : s.entry - price) / risk;
    setStatus('progress', `🚀 Trade en cours (${R > 0 ? '+' : ''}${R.toFixed(2)} R)`);
  } else {
    setStatus('wait', `⏳ Ordre en attente — entrée à ${fmt(s.entry)}`);
  }

  const size = (SET.cap * SET.risk / 100 / risk).toFixed(risk > 1 ? 2 : 4);
  $('ct-' + cur).innerHTML = `
    <div class="setup-compact ${s.type}">
      <div class="sc-item"><span class="sc-label">Entrée</span><span class="sc-val entry">${fmt(s.entry)}</span></div>
      <div class="sc-item"><span class="sc-label">SL</span><span class="sc-val sl">${fmt(s.sl)}</span></div>
      <div class="sc-item"><span class="sc-label">TP</span><span class="sc-val tp">${fmt(s.tp)}</span></div>
    </div>
    <div class="loading-text">
      ${b ? 'ACHAT' : 'VENTE'} · RR ${rr.toFixed(2)} · ${s.label}<br>
      Risque ${SET.risk}% = ${(SET.cap * SET.risk / 100).toFixed(0)} · Taille ≈ ${size} unités
      ${s.warn ? '<br>⚠️ Qualité réduite : ' + s.warn : ''}
    </div>`;
}

/* ---------- détecteurs ---------- */
function smcQ(d, i, dir) {
  let hh = -1e12, ll = 1e12;
  for (let j = Math.max(0, i - 11); j < i - 1; j++) {
    hh = Math.max(hh, d[j].high);
    ll = Math.min(ll, d[j].low);
  }
  const k = d[i], p = d[i - 1], nx = d[i + 1];
  const f = !!nx && (dir === 1 ? nx.low > p.high : nx.high < p.low);
  const bo = dir === 1 ? k.close > hh : k.close < ll;
  const sw = dir === 1 ? p.low < ll : p.high > hh;
  const t = [f && 'FVG', bo && 'BOS', sw && 'Sweep'].filter(Boolean);
  return { n: t.length, t: t.length ? ' · ' + t.join('+') : '' };
}

function detectSMC(done) {
  const c = data.slice(0, -1);
  hint = 'Aucun setup validé.';
  for (let i = c.length - 3; i >= Math.max(1, c.length - 20); i--) {
    const k = c[i], p = c[i - 1];
    if (done.includes(k.time)) continue;
    const big = Math.abs(k.close - k.open) > price * 0.0005;
    let dir = 0;
    if (big && k.close > k.open && p.close < p.open) dir = 1;
    else if (big && k.close < k.open && p.close > p.open) dir = -1;
    if (!dir) continue;
    const entry = (p.high + p.low) / 2;
    const sl = dir === 1 ? p.low - p.low * 0.0002 : p.high + p.high * 0.0002;
    const tp = dir === 1 ? entry + (entry - sl) * 2 : entry - (sl - entry) * 2;
    const q = smcQ(c, i, dir);
    const m = mk(dir === 1 ? 'buy' : 'sell', entry, sl, tp, c[c.length - 1].time, k.time, false, 'Order Block 50%' + q.t);
    m.q = q.n;
    return m;
  }
  return null;
}

function detectEMA(done) {
  const c = data.slice(0, -1);
  if (c.length < 210) {
    hint = `Données insuffisantes : ${c.length}/210 bougies`;
    return null;
  }
  const cl = c.map(x => x.close), e5 = emaArr(cl, 50), e2 = emaArr(cl, 200), L = c.length - 1;
  hint = `EMA50 ${e5[L] > e2[L] ? '>' : '<'} EMA200 · aucun croisement récent`;
  for (let i = L; i > L - 5; i--) {
    const up = e5[i - 1] <= e2[i - 1] && e5[i] > e2[i];
    const dn = e5[i - 1] >= e2[i - 1] && e5[i] < e2[i];
    if ((!up && !dn) || done.includes(c[i].time)) continue;
    const e = c[i].close, a = atrAt(c, i);
    if (!a) continue;
    return mk(up ? 'buy' : 'sell', e, up ? e - 2 * a : e + 2 * a, up ? e + 6 * a : e - 6 * a, c[i].time, c[i].time, true, up ? 'Golden Cross' : 'Death Cross');
  }
  return null;
}

function detectBB(done) {
  const c = data.slice(0, -1);
  if (c.length < 40) { hint = 'Données insuffisantes'; return null; }
  const cl = c.map(x => x.close), b = boll(cl), r = rsiArr(cl), i = c.length - 1, k = c[i];
  hint = `RSI ${r[i]?.toFixed(1) ?? '—'} · attente touche bande + RSI extrême`;
  const t = (k.low <= b.l[i] && r[i] < 30) ? 'buy' : (k.high >= b.u[i] && r[i] > 70) ? 'sell' : null;
  if (!t || done.includes(k.time)) return null;
  const a = atrAt(c, i), e = k.close;
  const sl = t === 'buy' ? e - 1.5 * a : e + 1.5 * a;
  const tp = b.m[i];
  if (Math.abs(tp - e) < 0.5 * Math.abs(e - sl)) {
    hint = 'Signal ignoré : bande médiane trop proche';
    return null;
  }
  return mk(t, e, sl, tp, k.time, k.time, true, 'Retour à la moyenne');
}

function calcAsia() {
  const last = data[data.length - 1];
  const day = Math.floor(loc(last.time) / 86400);
  let H = -1, L = 1e12, t1 = null, t2 = null;
  for (const c of data) {
    if (Math.floor(loc(c.time) / 86400) !== day) continue;
    if (Math.floor(loc(c.time) % 86400 / 3600) < 6) {
      H = Math.max(H, c.high);
      L = Math.min(L, c.low);
      if (t1 === null) t1 = c.time;
      t2 = c.time;
    }
  }
  return t1 === null ? null : { H, L, t1, t2, day, done: loc(last.time) >= day * 86400 + 21600 };
}

function detectAsia(done) {
  const R = asiaR, c = data.slice(0, -1);
  if (tf === '1d') { hint = 'Choisis un TF intraday (1m à 1h)'; return null; }
  if (!R) { hint = 'Pas de données de session asiatique pour ce jour'; return null; }
  if (!R.done) { hint = '⏳ Range asiatique en construction (00h–06h Paris)'; return null; }
  hint = `Range ${fmt(R.L)} – ${fmt(R.H)} · attente cassure Londres (08h–13h Paris)`;
  const id = 'A' + R.day;
  if (done.includes(id)) return null;
  const a = atrAt(c, c.length - 1);
  for (const k of c) {
    if (Math.floor(loc(k.time) / 86400) !== R.day) continue;
    const h = Math.floor(loc(k.time) % 86400 / 3600);
    if (h < 8 || h >= 13) continue;
    if (Math.abs(k.close - k.open) < 0.5 * a) continue;
    const t = k.close > R.H ? 'buy' : k.close < R.L ? 'sell' : null;
    if (!t) continue;
    const e = SET.retest ? (t === 'buy' ? R.H : R.L) : k.close;
    const sl = (R.H + R.L) / 2;
    const risk = Math.abs(e - sl);
    if (!risk) continue;
    return mk(t, e, sl, t === 'buy' ? e + 2 * risk : e - 2 * risk, k.time, id, !SET.retest, SET.retest ? 'Retest du range asiatique' : 'Cassure range asiatique');
  }
  return null;
}

/* ---------- Corys ---------- */
function corysCalc() {
  const n = data.length, S = 2.8;
  const ub = [], lb = [], st = [], dr = [], bull = [], bear = [], markers = [];
  for (let i = 0; i < n; i++) {
    const c = data[i].close, rg = 2 * (data[i].high - data[i].low), pc = i ? data[i - 1].close : NaN;
    let u = c + S * rg, l = c - S * rg;
    const pl = i ? lb[i - 1] : 0, pu = i ? ub[i - 1] : 0;
    l = (l > pl || pc < pl) ? l : pl;
    u = (u < pu || pc > pu) ? u : pu;
    ub.push(u); lb.push(l);
    dr.push(i === 0 ? 1 : (st[i - 1] === ub[i - 1] ? (c > u ? -1 : 1) : (c < l ? 1 : -1)));
    st.push(dr[i] === -1 ? l : u);
    bull.push(i > 0 && c > st[i] && pc <= st[i - 1]);
    bear.push(i > 0 && c < st[i] && pc >= st[i - 1]);
  }
  const cl = data.map(x => x.close), e10 = emaArr(cl, 10), e20 = emaArr(cl, 20);
  for (let i = Math.max(1, n - 1500); i < n; i++) {
    const t = data[i].time;
    if (e20[i - 1] != null && cl[i] > e10[i] && cl[i - 1] <= e10[i - 1] && e10[i] > e20[i] && e10[i - 1] <= e20[i - 1])
      markers.push({ time: t, position: 'belowBar', color: '#26a69a', shape: 'circle', text: 'PB' });
    if (bull[i]) markers.push({ time: t, position: 'belowBar', color: '#069981', shape: 'arrowUp', text: 'BUY' });
    if (bear[i]) markers.push({ time: t, position: 'aboveBar', color: '#F23645', shape: 'arrowDown', text: 'SELL' });
  }
  const aL = Math.min(500, Math.max(14, n >> 1)), L = 20;
  const atr = Array(n).fill(null), boxes = [];
  const tr = data.map((d, i) => i ? Math.max(d.high - d.low, Math.abs(d.high - data[i - 1].close), Math.abs(d.low - data[i - 1].close)) : d.high - d.low);
  if (n > aL) {
    let a = 0;
    for (let i = 0; i < aL; i++) a += tr[i];
    a /= aL;
    atr[aL - 1] = a;
    for (let i = aL; i < n; i++) { a = (a * (aL - 1) + tr[i]) / aL; atr[i] = a; }
  }
  let b = null, pcnt = 0;
  for (let i = L - 1; i < n; i++) {
    if (atr[i] == null) { pcnt = 0; continue; }
    let m = 0;
    for (let j = 0; j < L; j++) m += cl[i - j];
    m /= L;
    const A = atr[i];
    let cnt = 0;
    for (let j = 0; j < L; j++) if (Math.abs(cl[i - j] - m) > A) cnt++;
    if (cnt === 0 && pcnt !== 0) {
      if (b && i - L <= b.r) {
        b.top = Math.max(m + A, b.top);
        b.bot = Math.min(m - A, b.bot);
        b.r = i;
        b.col = '#2157f3';
        b.mid = (b.top + b.bot) / 2;
      } else {
        b = { l: Math.max(0, i - L), r: i, top: m + A, bot: m - A, mid: m, col: '#2157f3' };
        boxes.push(b);
      }
    } else if (cnt === 0 && b) b.r = i;
    if (b) {
      if (cl[i] > b.top) b.col = '#089981';
      else if (cl[i] < b.bot) b.col = '#f23645';
    }
    pcnt = cnt;
  }
  return { st, dir: dr, bull, bear, boxes, markers };
}

function detectCorys(done) {
  const n = data.length;
  hint = 'Aucun signal';
  if (!cy || n < 60) { hint = 'Données insuffisantes'; return null; }
  hint = `SuperTrend ${cy.dir[n - 2] === -1 ? 'haussier' : 'baissier'} · attente de croisement`;
  for (let i = n - 2; i >= n - 4; i--) {
    const b = cy.bull[i];
    if ((!b && !cy.bear[i]) || done.includes(data[i].time)) continue;
    const e = data[i].close, sl = cy.st[i], risk = Math.abs(e - sl);
    if (!risk || (b ? sl >= e : sl <= e)) continue;
    return mk(b ? 'buy' : 'sell', e, sl, b ? e + 2 * risk : e - 2 * risk, data[i].time, data[i].time, true, b ? 'Corys BUY' : 'Corys SELL');
  }
  return null;
}

/* ---------- OPR amélioré (génération de setups réels) ---------- */
function getNYTime(ts) {
  const nyString = new Date(ts * 1000).toLocaleString('en-US', { timeZone: 'America/New_York', hour12: false });
  const parts = nyString.split(', ')[1].split(':');
  return { h: parseInt(parts[0]), m: parseInt(parts[1]) };
}

function analyzeOPRRange() {
  if (data.length < 50) return;
  let oprH = -1, oprL = 999999, startT = null, endT = null;
  const todayStr = new Date().toLocaleDateString('en-US', { timeZone: 'America/New_York' });
  for (const bar of data) {
    const ny = getNYTime(bar.time);
    const barDayStr = new Date(bar.time * 1000).toLocaleDateString('en-US', { timeZone: 'America/New_York' });
    if (barDayStr !== todayStr) continue;
    if (ny.h === 9 && ny.m >= 30 && ny.m < 45) {
      if (startT === null) startT = bar.time;
      endT = bar.time;
      oprH = Math.max(oprH, bar.high);
      oprL = Math.min(oprL, bar.low);
    }
  }
  oprState.levels = { oprH, oprL };
  oprState.startTime = startT;
  oprState.endTime = endT;
  const nowNY = getNYTime(now);
  const ready = (nowNY.h > 9 || (nowNY.h === 9 && nowNY.m >= 45)) && oprH !== -1;
  if (ready) {
    let atrSum = 0;
    for (let i = Math.max(0, data.length - 14); i < data.length; i++) atrSum += (data[i].high - data[i].low);
    oprState.valid = (oprH - oprL) <= (atrSum / 14) * 3.0;
  } else {
    oprState.valid = false;
  }
}

function detectOPR(done) {
  analyzeOPRRange();
  const { oprH, oprL } = oprState.levels;
  if (!oprState.valid || oprH == null || oprL == null || oprH <= 0) {
    const nowNY = getNYTime(now);
    if (nowNY.h < 9 || (nowNY.h === 9 && nowNY.m < 45)) {
      hint = "⏳ Construction de l'OPR (09h30 – 09h45 NY)...";
    } else {
      hint = oprH > 0 ? '⚠️ OPR trop grand — journée ignorée' : 'Aucun OPR détecté aujourd\'hui';
    }
    return null;
  }

  hint = `OPR ${fmt(oprL)} – ${fmt(oprH)} · attente de sweep`;
  const id = 'OPR' + Math.floor(loc(now) / 86400);
  if (done.includes(id)) return null;

  // Cherche un sweep après la fin de la zone OPR
  const startIdx = oprState.endTime ? idxOf(oprState.endTime) : 0;
  for (let i = Math.max(startIdx, data.length - 30); i < data.length - 1; i++) {
    const k = data[i];
    // Sweep du high puis retour sous le high → short
    if (k.high > oprH && k.close < oprH) {
      const entry = oprH;
      const sl = k.high + (k.high - oprH) * 0.2;
      const risk = Math.abs(entry - sl);
      if (risk < 1e-8) continue;
      return mk('sell', entry, sl, entry - 2 * risk, k.time, id, false, 'OPR Sweep High');
    }
    // Sweep du low puis retour au-dessus → long
    if (k.low < oprL && k.close > oprL) {
      const entry = oprL;
      const sl = k.low - (oprL - k.low) * 0.2;
      const risk = Math.abs(entry - sl);
      if (risk < 1e-8) continue;
      return mk('buy', entry, sl, entry + 2 * risk, k.time, id, false, 'OPR Sweep Low');
    }
  }
  return null;
}

/* ---------- Filtres, backtest, confluence ---------- */
function adxArr(d, n = 14) {
  const o = Array(d.length).fill(null);
  let tr = 0, p = 0, m = 0, dx = [], adx = null;
  for (let i = 1; i < d.length; i++) {
    const up = d[i].high - d[i - 1].high, dn = d[i - 1].low - d[i].low, pc = d[i - 1].close;
    const t = Math.max(d[i].high - d[i].low, Math.abs(d[i].high - pc), Math.abs(d[i].low - pc));
    const pm = up > dn && up > 0 ? up : 0, mm = dn > up && dn > 0 ? dn : 0;
    if (i <= n) { tr += t; p += pm; m += mm; }
    else { tr = tr - tr / n + t; p = p - p / n + pm; m = m - m / n + mm; }
    if (i >= n) {
      const pi = 100 * p / tr, mi = 100 * m / tr;
      const x = 100 * Math.abs(pi - mi) / ((pi + mi) || 1);
      dx.push(x);
      if (dx.length === n) adx = dx.reduce((a, b) => a + b) / n;
      else if (dx.length > n) adx = (adx * (n - 1) + x) / n;
      if (adx !== null) o[i] = adx;
    }
  }
  return o;
}

let IND = null;
function ind() {
  const n = data.length, k = n + ':' + data[n - 1].time;
  if (IND && IND.k === k) return IND;
  const e200 = emaArr(data.map(x => x.close), 200);
  const atr = data.map((_, i) => atrAt(data, i));
  const va = Array(n).fill(null);
  let sum = 0;
  for (let i = 0; i < n; i++) {
    sum += atr[i];
    if (i >= 100) { sum -= atr[i - 100]; va[i] = sum / 100; }
  }
  return IND = { k, e200, atr, va, adx: adxArr(data), hr: data.map(x => Math.floor(loc(x.time) % 86400 / 3600)) };
}

function filt(key, s) {
  if (!(SET.trend || SET.adx || SET.sess || SET.vol || SET.smcq) || !data.length) return null;
  if (SET.smcq && key === 'smc' && !(s.q >= 1)) return 'OB sans FVG/BOS/Sweep';
  const I = ind(), i = Math.min(idxOf(s.t0), data.length - 1), b = s.type === 'buy', c = data[i].close;
  if (SET.trend && key !== 'ema' && key !== 'bb' && I.e200[i] != null && (b ? c < I.e200[i] : c > I.e200[i]))
    return 'contre-tendance (EMA 200)';
  if (SET.adx && I.adx[i] != null) {
    if (key === 'bb') { if (I.adx[i] > 25) return 'marché en tendance (ADX>25)'; }
    else if (I.adx[i] < 20) return 'marché sans tendance (ADX<20)';
  }
  if (SET.sess && sym !== 'BTCUSD' && (I.hr[i] < 8 || I.hr[i] >= 22)) return 'hors session (8h–22h Paris)';
  if (SET.vol && I.va[i] != null && (I.atr[i] < 0.5 * I.va[i] || I.atr[i] > 2.5 * I.va[i])) return 'volatilité hors norme';
  return null;
}

function dayLimit() {
  const v = (states.pnl || {})[Math.floor(loc(now) / 86400)] || 0;
  return SET.dll && SET.dl > 0 && v <= -SET.dl ? `perte max du jour atteinte (${v.toFixed(1)} R)` : null;
}

function conf() {
  let b = 0, s = 0;
  for (const k of on) {
    const x = states[k] && states[k].setup;
    if (x) x.type === 'buy' ? b++ : s++;
  }
  $('conf').innerHTML = (b + s)
    ? `🤝 Confluence : <b style="color:var(--up)">${b} achat</b> · <b style="color:var(--down)">${s} vente</b>${Math.max(b, s) >= 2 ? ' — ⭐ signal renforcé' : ''}`
    : '';
}

function sigs(key) {
  const n = data.length, cl = data.map(x => x.close), out = [];
  if (key === 'ema') {
    const e5 = emaArr(cl, 50), e2 = emaArr(cl, 200);
    for (let i = 201; i < n; i++) {
      const up = e5[i - 1] <= e2[i - 1] && e5[i] > e2[i];
      const dn = e5[i - 1] >= e2[i - 1] && e5[i] < e2[i];
      if (!up && !dn) continue;
      const a = atrAt(data, i), e = cl[i];
      if (a) out.push(mk(up ? 'buy' : 'sell', e, up ? e - 2 * a : e + 2 * a, up ? e + 6 * a : e - 6 * a, data[i].time, data[i].time, true));
    }
  }
  if (key === 'bb') {
    const b = boll(cl), r = rsiArr(cl);
    for (let i = 40; i < n; i++) {
      const k = data[i];
      const t = (k.low <= b.l[i] && r[i] < 30) ? 'buy' : (k.high >= b.u[i] && r[i] > 70) ? 'sell' : null;
      if (!t) continue;
      const a = atrAt(data, i), e = k.close;
      const sl = t === 'buy' ? e - 1.5 * a : e + 1.5 * a;
      const tp = b.m[i];
      if (Math.abs(tp - e) < 0.5 * Math.abs(e - sl)) continue;
      out.push(mk(t, e, sl, tp, k.time, k.time, true));
    }
  }
  if (key === 'corys') {
    const C = corysCalc();
    for (let i = 60; i < n; i++) {
      const bu = C.bull[i];
      if (!bu && !C.bear[i]) continue;
      const e = cl[i], sl = C.st[i], r = Math.abs(e - sl);
      if (!r || (bu ? sl >= e : sl <= e)) continue;
      out.push(mk(bu ? 'buy' : 'sell', e, sl, bu ? e + 2 * r : e - 2 * r, data[i].time, data[i].time, true));
    }
  }
  if (key === 'smc') {
    for (let i = 1; i < n - 3; i++) {
      const k = data[i], p = data[i - 1];
      const big = Math.abs(k.close - k.open) > k.close * 0.0005;
      let d = 0;
      if (big && k.close > k.open && p.close < p.open) d = 1;
      else if (big && k.close < k.open && p.close > p.open) d = -1;
      if (!d) continue;
      const e = (p.high + p.low) / 2;
      const sl = d === 1 ? p.low - p.low * 0.0002 : p.high + p.high * 0.0002;
      const m = mk(d === 1 ? 'buy' : 'sell', e, sl, d === 1 ? e + (e - sl) * 2 : e - (sl - e) * 2, data[i + 2].time, k.time, false);
      m.q = smcQ(data, i, d).n;
      out.push(m);
    }
  }
  if (key === 'asia' && tf !== '1d') {
    let day = -1, H = 0, L = 0, cnt = 0, fired = false;
    for (let i = 1; i < n; i++) {
      const t = loc(data[i].time), d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600);
      if (d !== day) { day = d; H = -1; L = 1e12; cnt = 0; fired = false; }
      if (h < 6) { H = Math.max(H, data[i].high); L = Math.min(L, data[i].low); cnt++; }
      else if (!fired && cnt > 0 && h >= 8 && h < 13) {
        const k = data[i];
        if (Math.abs(k.close - k.open) < 0.5 * atrAt(data, i - 1)) continue;
        const t2 = k.close > H ? 'buy' : k.close < L ? 'sell' : null;
        if (!t2) continue;
        const e = SET.retest ? (t2 === 'buy' ? H : L) : k.close;
        const sl = (H + L) / 2, r = Math.abs(e - sl);
        if (!r) continue;
        fired = true;
        out.push(mk(t2, e, sl, t2 === 'buy' ? e + 2 * r : e - 2 * r, k.time, k.time, !SET.retest));
      }
    }
  }
  return out;
}

function backtest(key, strict = true) {
  let free = -1, tr = [], dayR = {};
  for (const s of sigs(key)) {
    const i0 = idxOf(s.t0);
    if (i0 <= free || (strict && filt(key, s))) continue;
    const day = Math.floor(loc(s.t0) / 86400);
    if (SET.dl > 0 && (dayR[day] || 0) <= -SET.dl) continue;
    const r = evalSetup(s);
    if (r.st === 'active' || r.st === 'pending') continue;
    free = r.i;
    if (r.st === 'cancel') continue;
    tr.push(r.R);
    dayR[day] = (dayR[day] || 0) + r.R;
  }
  let cum = 0, pk = 0, dd = 0, w = 0, gp = 0, gl = 0;
  for (const R of tr) {
    cum += R;
    pk = Math.max(pk, cum);
    dd = Math.max(dd, pk - cum);
    if (R > 0) { w++; gp += R; } else gl -= R;
  }
  return { n: tr.length, win: tr.length ? 100 * w / tr.length : 0, avg: tr.length ? cum / tr.length : 0, pf: gl ? gp / gl : (gp ? Infinity : 0), dd };
}

function runBT() {

    <div class="loading-text" style="font-size:11px">${sym} ${tf} · ${data.length} bougies (${d0} → ${d1}). Peu de trades = résultats peu fiables. Hors spread/commissions. Passé ≠ futur.</div>`;
}

      ['partial', 'TP partiel 50% à +1R'],
      ['trail', 'Trailing stop (1R)'],
      ['retest', 'Asie : entrée sur retest'],
      ['smcq', 'SMC : exiger FVG/BOS/Sweep'],
      ['dll', 'Perte max/jour en direct'],
      ['soft', 'Mode souple : garder les signaux filtrés']
    ].map(([k, l]) => `<label class="ck"><input type="checkbox" id="s_${k}">${l}</label>`).join('')}
    <button id="btRun">▶ Lancer le backtest</button>
  </div><div id="btRes"></div>`;

  for (const k in SET) {
    const e = $('s_' + k);
    if (!e) continue;
    if (e.type === 'checkbox') e.checked = SET[k];
    else e.value = SET[k];
    e.onchange = () => {
      SET[k] = e.type === 'checkbox' ? e.checked : +e.value;
      localStorage.setItem('cv_set', JSON.stringify(SET));
      refresh();
    };
  }
  $('btRun').onclick = () => {
    $('btRes').innerHTML = '<div class="loading-text">Calcul…</div>';
    setTimeout(runBT, 30);
  };
  $('btHead').onclick = () => {
    B.style.display = B.style.display === 'none' ? 'block' : 'none';
  };
}

/* ---------- SMC MTF ---------- */
function badges() {
  const labels = [tf, '15m', '4h'], cl = data.map(x => x.close), e = emaArr(cl, 50);
  const own = e[e.length - 1] != null ? price > e[e.length - 1] : null;
  [own, htf.v[0], htf.v[1]].forEach((v, i) => {
    const el = $('b' + i);
    if (!el) return;
    el.className = 'mtf-badge' + (v === null ? '' : v ? ' up' : ' down');
    el.textContent = `${labels[i]} : ${v === null ? '—' : v ? 'HAUSSE' : 'BAISSE'}`;
  });
}

async function loadHTF() {
  const k = sym;
  if (htf.k === k && Date.now() - htf.t < 60000) return;
  htf.k = k; htf.t = Date.now();
  const r = await Promise.all([getBars(k, '15m', 250), getBars(k, '4h', 250)]);
  if (k !== sym) return;
  htf.v = r.map(b => {
    if (!b || b.length < 50) return null;
    const c = b.map(x => x.close), e = emaArr(c, 50);
    return c[c.length - 1] > e[e.length - 1];
  });
  if (on.has('smc')) badges();
}

/* ---------- indicateurs graphiques ---------- */
function setInd() {
  const ser = a => a.map((v, i) => v == null ? null : { time: data[i].time, value: v }).filter(Boolean);
  const cl = data.map(x => x.close);
  if (on.has('ema')) {
    lines.e50.setData(ser(emaArr(cl, 50)));
    lines.e200.setData(ser(emaArr(cl, 200)));
  } else {
    lines.e50.setData([]);
    lines.e200.setData([]);
  }
  if (on.has('bb')) {
    const b = boll(cl);
    lines.bu.setData(ser(b.u));
    lines.bl.setData(ser(b.l));
    lines.bm.setData(ser(b.m));
  } else {
    lines.bu.setData([]);
    lines.bl.setData([]);
    lines.bm.setData([]);
  }
  candle.setMarkers(on.has('corys') && cy ? cy.markers : []);
}

/* ---------- onglets ---------- */
function buildTabs() {
  $('tabs').innerHTML = Object.entries(STRATS).map(([k, v]) =>
    `<div class="tab" data-k="${k}">${v}</div>`
  ).join('');
  $('tabs').onclick = e => {
    const t = e.target.closest('.tab');
    if (t) toggle(t.dataset.k);
  };
  $('secs').innerHTML = Object.entries(STRATS).map(([k, v]) =>
    `<div id="sec-${k}" style="display:none">` +
    (k === 'smc' ? '<div class="mtf-row"><div class="mtf-badge" id="b0">…</div><div class="mtf-badge" id="b1">…</div><div class="mtf-badge" id="b2">…</div></div>' : '') +
    `<div id="st-${k}" class="status status-wait">…</div>` +
    (k === 'opr' ? '<div class="opr-legend"><span><i class="leg-color"></i>Zone OPR</span></div>' : '') +
    `<div class="panel-header">${v}</div><div id="ct-${k}"><div class="loading-text">…</div></div></div>`
  ).join('');
}

function applyOn() {
  document.querySelectorAll('.tab').forEach(e => e.classList.toggle('active', on.has(e.dataset.k)));
  for (const k in STRATS) {
    const el = $('sec-' + k);
    if (el) el.style.display = on.has(k) ? 'block' : 'none';
  }
  $('empty').style.display = on.size ? 'none' : 'block';
}

function toggle(k) {
  on.has(k) ? on.delete(k) : on.add(k);
  localStorage.setItem('cv_on', JSON.stringify([...on]));
  applyOn();
  if (on.has(k) && k === 'opr' && tf !== '1m') {
    tf = '1m';
    $('tfSelect').value = '1m';
    resetData();
    fetchMainData();
  } else refresh();
}

function refresh() {
  if (data.length < 2) return;
  if (on.has('asia')) asiaR = calcAsia();
  if (on.has('corys')) cy = corysCalc();
  const f = {
    smc: () => { badges(); manage('smc', detectSMC); },
    opr: () => manage('opr', detectOPR),
    ema: () => manage('ema', detectEMA),
    bb: () => manage('bb', detectBB),
    asia: () => manage('asia', detectAsia),
    corys: () => manage('corys', detectCorys)
  };
  for (const k of on) f[k]();
  conf();
  setInd();
  updateDayPnl();
  sd();
}

/* ---------- données ---------- */
async function fetchUrl(u) {
  try {
    const r = await fetch(u);
    if (r.ok) return await r.json();
  } catch (e) {}
  try {
    const r = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`);
    if (r.ok) return await r.json();
  } catch (e) {}
  return null;
}

async function getBars(s, i, limit) {
  const q = async n => {
    const r = await fetchUrl(`https://biquote.io/api/${s}/ohlc?interval=${i}&limit=${n}&t=${Date.now()}`);
    return r && r.bars ? r.bars : null;
  };
  let raw = null;
  const c0 = [...new Set([limit, ...[1500, 1000, 300].filter(n => n < limit)].map(n => Math.min(n, maxLim)))];
  for (const n of c0) {
    raw = await q(n);
    if (raw && raw.length) {
      if (n < c0[0]) maxLim = n;
      break;
    }
    raw = null;
  }
  if (!raw) return null;
  const seen = new Set(), out = [];
  for (const d of raw) {
    const t = Math.floor(new Date(d.openTime).getTime() / 1000);
    if (isNaN(t) || seen.has(t)) continue;
    seen.add(t);
    out.push({ time: t, open: +d.open, high: +d.high, low: +d.low, close: +d.close });
  }
  return out.sort((a, b) => a.time - b.time);
}

function resetData() {
  cy = null;
  data = [];
  candle.setData([]);
  IND = null;
}

async function fetchMainData(force = false) {
  const my = ++seqStarted, s = sym, t = tf;
  const bars = await getBars(s, t, 5000);

  if (!bars || !bars.length) {
    fetchErrors++;
    lastFetchOk = false;
    updateStatusBar();
    $('errBanner').textContent = 'Impossible de charger les données. Nouvelle tentative dans quelques secondes…';
    $('errBanner').classList.add('show');
    if (fetchErrors === 1) log('Échec chargement données', 'error');
    return;
  }

  if (s !== sym || t !== tf || my < seqApplied) return;

  seqApplied = my;
  fetchErrors = 0;
  lastFetchOk = true;
  lastFetchTs = Date.now();
  $('errBanner').classList.remove('show');
  updateStatusBar();

  const prevLast = data.length ? data[data.length - 1].time : null;
  if (prevLast !== null && bars.some(b => b.time === prevLast)) {
    for (const b of bars) if (b.time >= prevLast) candle.update(b);
  } else {
    candle.setData(bars);
    chart.timeScale().setVisibleLogicalRange({ from: bars.length - 150, to: bars.length + 8 });
  }
  data = bars;
  price = bars[bars.length - 1].close;
  now = bars[bars.length - 1].time;
  loadHTF();
  refresh();
}

/* ---------- dessin ---------- */
let raf = 0;
const sd = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); };

function draw() {
  const r = $('chart').getBoundingClientRect(), d = window.devicePixelRatio || 1;
  const w = Math.round(r.width * d), h = Math.round(r.height * d);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);
  const CW = r.width, X = t => chart.timeScale().timeToCoordinate(t), Y = p => candle.priceToCoordinate(p);

  for (const st of ['smc', 'ema', 'bb', 'asia', 'corys', 'opr']) {
    if (on.has(st) && states[st] && states[st].setup) {
      const s = states[st].setup, pend = states[st].live === 'pending';
      const x0 = Math.max(0, X(s.t0) ?? CW - 100), yE = Y(s.entry), yS = Y(s.sl), yT = Y(s.tp);
      if (yE !== null && yS !== null && yT !== null) {
        ctx.lineWidth = 2;
        if (pend) ctx.setLineDash([4, 4]);
        ctx.fillStyle = 'rgba(38,166,154,.15)';
        ctx.strokeStyle = 'rgba(38,166,154,.8)';
        ctx.fillRect(x0, Math.min(yE, yT), CW - x0, Math.abs(yE - yT));
        ctx.strokeRect(x0, Math.min(yE, yT), CW - x0, Math.abs(yE - yT));
        ctx.fillStyle = 'rgba(239,83,80,.15)';
        ctx.strokeStyle = 'rgba(239,83,80,.8)';
        ctx.fillRect(x0, Math.min(yE, yS), CW - x0, Math.abs(yE - yS));
        ctx.strokeRect(x0, Math.min(yE, yS), CW - x0, Math.abs(yE - yS));
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(x0, yE);
        ctx.lineTo(CW, yE);
        ctx.strokeStyle = '#2962ff';
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }

  if (on.has('asia') && asiaR) {
    const x0 = Math.max(0, X(asiaR.t1) ?? 0), yH = Y(asiaR.H), yL = Y(asiaR.L);
    if (yH !== null && yL !== null) {
      ctx.fillStyle = 'rgba(41,98,255,.15)';
      ctx.strokeStyle = 'rgba(41,98,255,.9)';
      ctx.lineWidth = 1;
      ctx.fillRect(x0, yH, CW - x0, yL - yH);
      ctx.strokeRect(x0, yH, CW - x0, yL - yH);
      ctx.fillStyle = '#5b8cff';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('Range Asie', x0 + 4, yH - 5);
    }
  }

  if (on.has('corys') && cy) {
    for (const b of cy.boxes.slice(-30)) {
      if (!data[b.l] || !data[b.r]) continue;
      const x0 = X(data[b.l].time), x1 = X(data[b.r].time);
      const yT = Y(b.top), yB = Y(b.bot);
      if (x0 === null || x1 === null || yT === null || yB === null) continue;
      ctx.globalAlpha = .2;
      ctx.fillStyle = b.col;
      ctx.fillRect(x0, yT, x1 - x0, yB - yT);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = b.col;
      ctx.lineWidth = 1;
      ctx.strokeRect(x0, yT, x1 - x0, yB - yT);
    }
  }

  if (on.has('opr') && oprState.levels.oprH > 0) {
    const line = (p, label) => {
      const y = Y(p);
      if (y === null) return;
      ctx.strokeStyle = '#ff9800';
      ctx.lineWidth = 1;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(CW, y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ff9800';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(label, 5, y - 5);
    };
    line(oprState.levels.oprH, 'OPR H');
    line(oprState.levels.oprL, 'OPR L');
    if (oprState.startTime && oprState.endTime) {
      const xs = X(oprState.startTime), xe = X(oprState.endTime);
      const yH = Y(oprState.levels.oprH), yL = Y(oprState.levels.oprL);
      if (xs !== null && xe !== null && yH !== null && yL !== null) {
        ctx.fillStyle = 'rgba(255,152,0,.15)';
        ctx.fillRect(xs, yH, xe - xs, yL - yH);
        ctx.strokeStyle = 'rgba(255,152,0,.8)';
        ctx.strokeRect(xs, yH, xe - xs, yL - yH);
        ctx.fillStyle = '#ff9800';
        ctx.fillText('Zone OPR', xs + 2, yH - 8);
      }
    }
  }
}

/* ---------- init ---------- */
function initChart() {
  const el = $('chart');
  chart = LightweightCharts.createChart(el, {
    layout: { background: { type: 'solid', color: '#05080c' }, textColor: '#d1d4dc' },
    grid: { vertLines: { color: '#1a1f2c' }, horzLines: { color: '#1a1f2c' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#2f3a52' },
    timeScale: { borderColor: '#2f3a52', timeVisible: true, secondsVisible: false }
  });
  candle = chart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350',
    borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350'
  });
  const L = (c, w) => chart.addLineSeries({
    color: c, lineWidth: w, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false
  });
  lines.e50 = L('#2962ff', 2);
  lines.e200 = L('#ff9800', 2);
  lines.bu = L('rgba(98,142,255,.8)', 1);
  lines.bl = L('rgba(98,142,255,.8)', 1);
  lines.bm = L('rgba(139,148,168,.7)', 1);

  new ResizeObserver(() => {
    const r = el.getBoundingClientRect();
    chart.applyOptions({ width: r.width, height: r.height });
    sd();
  }).observe(el);

  chart.timeScale().subscribeVisibleLogicalRangeChange(sd);
  chart.subscribeCrosshairMove(sd);
  ['wheel', 'pointermove', 'touchmove'].forEach(e =>
    $('chartContainer').addEventListener(e, sd, { passive: true })
  );

  $('symbolSelect').value = sym;
  $('tfSelect').value = tf;
}

$('symbolSelect').addEventListener('change', e => {
  sym = e.target.value;
  localStorage.setItem('cv_symbol', sym);
  loadStates();
  htf.k = '';
  resetData();
  log('Changement → ' + sym);
  fetchMainData(true);
});

$('tfSelect').addEventListener('change', e => {
  tf = e.target.value;
  localStorage.setItem('cv_tf', tf);
  resetData();
  log('Timeframe → ' + tf);
  fetchMainData(true);
});

$('btnRefresh').addEventListener('click', () => {
  log('Rafraîchissement manuel');
  fetchMainData(true);
});

window.addEventListener('load', () => {
  buildTabs();
  buildBT();
  initChart();
  loadStates();
  applyOn();
  updateDayPnl();
  fetchMainData();
  setInterval(() => fetchMainData(), 5000);
});
</script>
