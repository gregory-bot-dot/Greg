<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ChartVision Pro — SMC & News</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root{
    --bg:#0b0e14;--panel:#131722;--panel2:#1a1f2c;--line:#2f3a52;
    --txt:#e8eef7;--muted:#8b94a8;--acc:#2962ff;--up:#26a69a;--down:#ef5350;--warn:#ff9800;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%; margin:0; padding:0; overflow:hidden;}
  body{ background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; }
  
  header{ padding:10px 15px; background:#0e1219; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  header h1{font-size:18px;margin:0;font-weight:700; white-space:nowrap;}
  header h1 span{color:var(--acc)}
  
  .controls{display:flex; gap:8px; flex:1; min-width:250px;}
  select{
    flex:1; background:var(--panel2); border:1px solid var(--line); color:#fff;
    border-radius:6px; padding:8px; font-size:13px; font-family:inherit; outline:none; font-weight:600;
    appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238b94a8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
    background-repeat: no-repeat; background-position: right 10px top 50%; background-size: 10px auto;
  }
  
  .app{display:flex; flex:1; overflow:hidden; position:relative;}
  @media(max-width:900px){ .app{flex-direction:column;} }
  
  .chart-container{ flex:1; position:relative; background:#05080c; min-height: 300px; }
  #chart{ position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  
  .panel{ width:340px; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; overflow-y:auto; }
  @media(max-width:900px){ .panel{width:100%; height:55vh; border-left:none; border-top:1px solid var(--line);} }
  
  .mtf-row { display: flex; gap: 6px; padding: 10px 15px; border-bottom: 1px solid var(--line); background: rgba(0,0,0,0.2); }
  .mtf-badge { flex: 1; text-align: center; padding: 6px; border-radius: 6px; font-size: 11px; font-weight: bold; border: 1px solid var(--line); background: var(--panel2); color: var(--muted); }
  .mtf-badge.up { border-color: var(--up); color: var(--up); background: rgba(38,166,154,0.1); }
  .mtf-badge.down { border-color: var(--down); color: var(--down); background: rgba(239,83,80,0.1); }

  #tradeStatus { padding: 12px 15px; font-weight: bold; font-size: 13px; text-align: center; border-bottom: 1px solid var(--line); transition: 0.3s; }
  .status-wait { background: rgba(255,152,0,0.15); color: var(--warn); }
  .status-entry { background: rgba(41,98,255,0.2); color: var(--acc); border-left: 4px solid var(--acc); }
  .status-progress { background: rgba(38,166,154,0.15); color: var(--up); }
  .status-invalid { background: rgba(239,83,80,0.15); color: var(--down); }
  .status-cooldown { background: rgba(139,148,168,0.15); color: var(--muted); border-left: 4px solid var(--muted); display: flex; flex-direction: column; gap: 8px;}
  .status-confluence { background: rgba(156,39,176,0.2); color: #e1bee7; border-left: 4px solid #9c27b0; }

  .btn-skip { background: var(--panel2); border: 1px solid var(--line2); color: var(--txt); padding: 6px 12px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; width: fit-content; margin: 0 auto; }
  .btn-skip:active { background: var(--line); }

  #confluenceBox { display: none; padding: 10px 15px; border-bottom: 1px solid var(--line); background: rgba(41,98,255,0.05); }
  .conf-title { font-size: 10px; color: var(--muted); text-transform: uppercase; font-weight: bold; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .conf-score { font-size: 14px; font-weight: bold; color: var(--acc); }
  .conf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 11px; }
  .conf-item { display: flex; align-items: center; gap: 4px; }
  .conf-item.yes { color: var(--up); }
  .conf-item.no { color: var(--muted); opacity: 0.6; }

  #lastTradeBox { display: none; padding: 10px 15px; border-bottom: 1px solid var(--line); background: rgba(0,0,0,0.3); font-size: 12px; }
  .lt-title { font-size: 10px; color: var(--muted); text-transform: uppercase; font-weight: bold; margin-bottom: 6px; }
  .lt-grid { display: flex; justify-content: space-between; align-items: flex-end; }
  .lt-item small { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; }
  .lt-item b { font-family: monospace; color: #fff; font-size: 13px; }
  .lt-result { font-weight: bold; text-align: right; font-size: 13px; }

  .panel-header{padding:12px 15px; border-bottom:1px solid var(--line); font-weight:bold; text-transform:uppercase; font-size:11px; color:var(--muted);}
  
  .setup{padding:15px; border-bottom:1px solid var(--line);}
  .setup.buy{background:linear-gradient(180deg, rgba(38,166,154,0.1) 0%, transparent 100%); border-left: 4px solid var(--up);}
  .setup.sell{background:linear-gradient(180deg, rgba(239,83,80,0.1) 0%, transparent 100%); border-left: 4px solid var(--down);}
  
  .setup-title{font-weight:bold; font-size:15px; margin-bottom:12px; color: #fff;}
  .trade-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .cell{background:rgba(0,0,0,0.3); padding:10px; border-radius:4px; border:1px solid var(--line);}
  .cell small{display:block; color:var(--muted); font-size:10px; text-transform:uppercase; margin-bottom:2px;}
  .cell b{font-family:monospace; font-size:14px; color:#fff;}
  .cell.precision { border-color: var(--acc); background: rgba(41,98,255,0.15); }
  .cell.precision b { color: var(--acc); font-size:15px;}

  .loading-text { padding:20px; text-align:center; color:var(--muted); font-size:13px; }

  /* CALENDRIER ECONOMIQUE */
  .calendar-box { padding: 10px; border-top: 1px solid var(--line); background: var(--panel); }
  .calendar-title { font-size: 10px; color: var(--muted); text-transform: uppercase; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  iframe { width: 100%; height: 350px; border: none; border-radius: 6px; background: #fff; }
</style>
</head>
<body>

<header>
  <h1>Chart<span>Vision</span></h1>
  <div class="controls">
    <select id="symbolSelect">
      <option value="XAUUSD">🥇 XAU/USD</option>
      <option value="BTCUSD">₿ BTC/USD</option>
      <option value="EURUSD">🇪🇺 EUR/USD</option>
      <option value="US500">🇺🇸 S&P 500</option>
    </select>
    <select id="tfSelect">
      <option value="1m">1m</option>
      <option value="5m">5m</option>
      <option value="15m">15m</option>
      <option value="1h">1h</option>
      <option value="4h">4h</option>
      <option value="1d">1D (Daily)</option>
    </select>
  </div>
</header>

<div class="app">
  <div class="chart-container" id="chartContainer"><div id="chart"></div></div>
  
  <div class="panel">
    <div class="mtf-row">
      <div class="mtf-badge" id="badge-current">...</div>
      <div class="mtf-badge" id="badge-htf1">...</div>
      <div class="mtf-badge" id="badge-htf2">...</div>
    </div>

    <div id="tradeStatus" class="status-wait">Calcul du statut...</div>

    <div id="confluenceBox">
      <div class="conf-title">
        <span id="confReason">Score de Confluence</span>
        <span class="conf-score" id="confScore">0/5</span>
      </div>
      <div class="conf-grid">
        <div class="conf-item" id="conf-1">1. CHoCH</div>
        <div class="conf-item" id="conf-2">2. Displacement</div>
        <div class="conf-item" id="conf-3">3. Volume</div>
        <div class="conf-item" id="conf-4">4. Session</div>
      </div>
    </div>

    <div id="lastTradeBox">
      <div class="lt-title">Dernier trade terminé</div>
      <div class="lt-grid">
        <div class="lt-item"><small>Entrée</small><b id="lt-entry">-</b></div>
        <div class="lt-item"><small>SL</small><b id="lt-sl">-</b></div>
        <div class="lt-item"><small>TP</small><b id="lt-tp">-</b></div>
        <div class="lt-item lt-result" id="lt-result">-</div>
      </div>
    </div>

    <div class="panel-header"><div>Trade Actif</div></div>
    <div id="analysisContent"><div class="loading-text">Initialisation...</div></div>

    <!-- CALENDRIER ECONOMIQUE EN DIRECT -->
    <div class="calendar-box">
      <div class="calendar-title">
        <span>📅 Calendrier Économique</span>
      </div>
      <!-- Iframe ForexFactory (thème clair pour la lisibilité) -->
      <iframe src="https://sslecal2.forexprostools.com?columns=exc_flags,exc_currency,exc_importance,exc_actual,exc_forecast,exc_previous&features=datepicker,timezone&countries=5,17,29,22&calType=day&timeZone=55&lang=4" allowtransparency="true" frameborder="0"></iframe>
    </div>

  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let chart, candleSeries;
let currentData = [];
let currentSymbol = 'XAUUSD';
let currentTF = '1m';
let currentPrice = 0;
let updateInterval = null;
let htfInterval = null;
let priceLines = []; 

let trends = { current: 'neutral', htf1: 'neutral', htf2: 'neutral' };
let currentHtf1 = '15m'; let currentHtf2 = '4h';

let lockedSetup = null;
let tradeState = 'IDLE'; 
let cooldownEndTime = 0; 
let lastTrade = null; 

if(localStorage.getItem('cv_symbol')) currentSymbol = localStorage.getItem('cv_symbol');
if(localStorage.getItem('cv_tf')) currentTF = localStorage.getItem('cv_tf');

function tfToSeconds(tf) {
    if (tf === '1m') return 60; if (tf === '5m') return 300; if (tf === '15m') return 900; if (tf === '1h') return 3600; if (tf === '4h') return 14400; if (tf === '1d') return 86400; return 60;
}
function getDecimals(symbol) {
  if(symbol.includes('JPY')) return 3; if(symbol === 'XAUUSD') return 2; if(symbol === 'BTCUSD' || symbol === 'US500' || symbol === 'US100') return 1; return 5;
}

/* =========================================
   CALCULS TECHNIQUES & MTF
   ========================================= */
function calculateATR(period) {
    if (currentData.length < period + 1) return 0;
    let trSum = 0;
    for (let i = currentData.length - period; i < currentData.length; i++) {
        const current = currentData[i]; const prev = currentData[i-1];
        const tr = Math.max(current.high - current.low, Math.abs(current.high - prev.close), Math.abs(current.low - prev.close));
        trSum += tr;
    }
    return trSum / period;
}
function calculateSMAVolume(period) {
    if (currentData.length < period) return 0;
    let sum = 0;
    for (let i = currentData.length - period; i < currentData.length; i++) { sum += (currentData[i].volume || 0); }
    return sum / period;
}
function calculateEMA(data, period) {
  if (!data || data.length < period) return 0;
  const k = 2 / (period + 1);
  let ema = data.slice(0, period).reduce((acc, c) => acc + parseFloat(c.close), 0) / period;
  for (let i = period; i < data.length; i++) { ema = (parseFloat(data[i].close) - ema) * k + ema; }
  return ema;
}

function updateHTFTargets() {
    if (currentTF === '1m' || currentTF === '5m') { currentHtf1 = '15m'; currentHtf2 = '4h'; }
    else if (currentTF === '15m') { currentHtf1 = '1h'; currentHtf2 = '4h'; }
    else if (currentTF === '1h') { currentHtf1 = '4h'; currentHtf2 = '1d'; }
    else if (currentTF === '4h') { currentHtf1 = '1d'; currentHtf2 = null; }
    else if (currentTF === '1d') { currentHtf1 = null; currentHtf2 = null; }
    $('badge-htf1').textContent = currentHtf1 || '--';
    $('badge-htf2').textContent = currentHtf2 || '--';
}

function initChart() {
  const chartContainer = $('chart');
  chart = LightweightCharts.createChart(chartContainer, {
    layout: { background: { type: 'solid', color: '#05080c' }, textColor: '#d1d4dc' },
    grid: { vertLines: { color: '#1a1f2c' }, horzLines: { color: '#1a1f2c' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#2f3a52' },
    timeScale: { borderColor: '#2f3a52', timeVisible: true, secondsVisible: false },
  });
  candleSeries = chart.addCandlestickSeries({ upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350' });
  const resizeObserver = new ResizeObserver(entries => {
    if (entries.length === 0 || entries[0].target !== chartContainer) return;
    const newRect = entries[0].contentRect;
    chart.applyOptions({ width: newRect.width, height: newRect.height });
  });
  resizeObserver.observe(chartContainer);
  $('symbolSelect').value = currentSymbol;
  $('tfSelect').value = currentTF;
  updateHTFTargets();
}

async function fetchUrl(targetUrl) {
  try {
    let res = await fetch(targetUrl);
    if (res.ok) return await res.json();
  } catch(e) {}
  try {
    let res = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`);
    if (res.ok) return await res.json();
  } catch(e) {}
  return null;
}

async function fetchHTF() {
    if (currentHtf1) {
        const res = await fetchUrl(`https://biquote.io/api/${currentSymbol}/ohlc?interval=${currentHtf1}&limit=100&t=${Date.now()}`);
        if (res && res.bars) { trends.htf1 = calculateEMA(res.bars, 50) < parseFloat(res.bars[res.bars.length-1].close) ? 'up' : 'down'; updateBadge('badge-htf1', currentHtf1, trends.htf1); }
    }
    if (currentHtf2) {
        const res = await fetchUrl(`https://biquote.io/api/${currentSymbol}/ohlc?interval=${currentHtf2}&limit=100&t=${Date.now()}`);
        if (res && res.bars) { trends.htf2 = calculateEMA(res.bars, 50) < parseFloat(res.bars[res.bars.length-1].close) ? 'up' : 'down'; updateBadge('badge-htf2', currentHtf2, trends.htf2); }
    }
}

function updateBadge(id, label, trend) {
    const el = $(id);
    el.className = 'mtf-badge ' + trend;
    el.textContent = `${label} : ${trend === 'up' ? 'HAUSSE' : 'BAISSE'}`;
}

async function fetchMainData() {
  if (!candleSeries) return;
  const result = await fetchUrl(`https://biquote.io/api/${currentSymbol}/ohlc?interval=${currentTF}&limit=200&t=${Date.now()}`);
  
  if (!result || !result.bars || result.bars.length === 0) {
      $('analysisContent').innerHTML = `<div class="loading-text" style="color:var(--warn)">Données indisponibles.</div>`;
      return;
  }

  const parsedData = result.bars.map(d => ({ time: Math.floor(new Date(d.openTime).getTime() / 1000), open: parseFloat(d.open), high: parseFloat(d.high), low: parseFloat(d.low), close: parseFloat(d.close), volume: parseFloat(d.volume || 0) }));
  const uniqueData = []; const seenTimes = new Set();
  for(const item of parsedData) { if(!seenTimes.has(item.time) && !isNaN(item.time)) { seenTimes.add(item.time); uniqueData.push(item); } }
  currentData = uniqueData.sort((a, b) => a.time - b.time);
  
  candleSeries.setData(currentData);
  
  if (currentData.length > 0) { 
      currentPrice = currentData[currentData.length - 1].close; 
      trends.current = calculateEMA(currentData, 50) < currentPrice ? 'up' : 'down';
      updateBadge('badge-current', currentTF, trends.current);
      analyzeSMC(); 
  }
}

/* =========================================
   LOGIQUE SMC & GESTION
   ========================================= */
function analyzeSMC() {
  if (currentData.length < 50) return;
  try {
    const isCurrentUp = trends.current === 'up';
    const atr = calculateATR(14);
    const volSMA = calculateSMAVolume(20);
    const currentTime = currentData[currentData.length - 1].time;

    if (tradeState === 'COOLDOWN') {
        if (currentTime >= cooldownEndTime) {
            tradeState = 'IDLE';
            lockedSetup = null;
        } else {
            const secondsLeft = cooldownEndTime - currentTime;
            const timeLabel = secondsLeft >= 60 ? Math.ceil(secondsLeft / 60) + " min" : secondsLeft + " sec";
            updateTradeStatus(currentPrice, isCurrentUp, timeLabel);
            drawLines(null);
            return; 
        }
    }

    if (tradeState === 'ACTIVE' && lockedSetup) {
        if (lockedSetup.direction !== trends.current) {
            lockedSetup = null; tradeState = 'IDLE';
        } else {
            if ((lockedSetup.type === 'buy' && currentPrice >= lockedSetup.tp) || (lockedSetup.type === 'sell' && currentPrice <= lockedSetup.tp)) {
                saveLastTrade(lockedSetup, 'TP'); tradeState = 'COOLDOWN'; cooldownEndTime = currentTime + (3 * tfToSeconds(currentTF)); 
            } else if ((lockedSetup.type === 'buy' && currentPrice < lockedSetup.sl) || (lockedSetup.type === 'sell' && currentPrice > lockedSetup.sl)) {
                saveLastTrade(lockedSetup, 'SL'); tradeState = 'COOLDOWN'; cooldownEndTime = currentTime + (3 * tfToSeconds(currentTF));
            }
            updateTradeStatus(currentPrice, isCurrentUp);
            renderPanel(isCurrentUp);
            drawLines(lockedSetup);
            return;
        }
    }

    if (tradeState === 'IDLE') {
        const closedCandles = currentData.slice(0, -1);
        let validOB = null;
        let confluenceScore = 0;
        let confluenceDetails = { choch: false, displacement: false, volume: false, session: false };
        let waitReason = "";

        for (let i = closedCandles.length - 3; i >= closedCandles.length - 40; i--) {
            const c = closedCandles[i]; 
            const prev = closedCandles[i-1];
            
            let isCHoCH = false;
            let obTop = 0, obBottom = 0, sl = 0, entry = 0;
            let direction = "";

            if (c.close > c.open && prev.close < prev.open && Math.abs(c.close - c.open) > currentPrice * 0.0001) {
                obTop = prev.high; obBottom = prev.low;
                let isValid = true;
                for(let j = i+1; j < currentData.length; j++) { if(currentData[j].low < (obBottom - (obBottom * 0.0002))) { isValid = false; break; } }
                if(isValid) { isCHoCH = true; direction = "buy"; sl = obBottom - (obBottom * 0.0002); entry = obTop - ((obTop - obBottom)/2); }
            } 
            else if (c.close < c.open && prev.close > prev.open && Math.abs(c.close - c.open) > currentPrice * 0.0001) {
                obTop = prev.high; obBottom = prev.low;
                let isValid = true;
                for(let j = i+1; j < currentData.length; j++) { if(currentData[j].high > (obTop + (obTop * 0.0002))) { isValid = false; break; } }
                if(isValid) { isCHoCH = true; direction = "sell"; sl = obTop + (obTop * 0.0002); entry = obBottom + ((obTop - obBottom)/2); }
            }

            if (isCHoCH) {
                confluenceScore = 1; confluenceDetails.choch = true;
                const bodySize = Math.abs(c.close - c.open);
                const totalWick = c.high - c.low;
                if (bodySize > totalWick * 0.6 && bodySize > atr * 1.2) { confluenceScore++; confluenceDetails.displacement = true; }
                if (c.volume > 0 && c.volume > volSMA * 1.5) { confluenceScore++; confluenceDetails.volume = true; }
                else if (c.volume === 0) { confluenceDetails.volume = true; }
                const hour = new Date(c.time * 1000).getUTCHours();
                if (hour >= 7 && hour <= 16) { confluenceScore++; confluenceDetails.session = true; }

                if (confluenceScore >= 2 && direction === (isCurrentUp ? "buy" : "sell")) {
                    validOB = { top: obTop, bottom: obBottom, entry: entry, sl: sl };
                    waitReason = confluenceScore === 2 ? "Setup mineur (Confirmation faible)" : "";
                    break; 
                } else {
                    waitReason = "Recherche d'une meilleure confluence...";
                }
            }
        }

        $('confluenceBox').style.display = 'block';
        $('confScore').textContent = `${confluenceScore}/5`;
        $('confReason').textContent = waitReason || "Score de Confluence";
        $('conf-1').className = 'conf-item ' + (confluenceDetails.choch ? 'yes' : 'no');
        $('conf-2').className = 'conf-item ' + (confluenceDetails.displacement ? 'yes' : 'no');
        $('conf-3').className = 'conf-item ' + (confluenceDetails.volume ? 'yes' : 'no');
        $('conf-4').className = 'conf-item ' + (confluenceDetails.session ? 'yes' : 'no');

        if (validOB) {
            lockedSetup = {
                type: isCurrentUp ? 'buy' : 'sell',
                direction: trends.current,
                entry: validOB.entry, sl: validOB.sl,
                tp: isCurrentUp ? validOB.entry + (Math.abs(validOB.entry - validOB.sl) * 2) : validOB.entry - (Math.abs(validOB.entry - validOB.sl) * 2)
            };
            tradeState = 'ACTIVE';
            updateTradeStatus(currentPrice, isCurrentUp);
            renderPanel(isCurrentUp);
            drawLines(lockedSetup);
        } else {
            lockedSetup = null;
            updateTradeStatus(currentPrice, isCurrentUp);
            renderPanel(isCurrentUp);
            drawLines(null);
        }
    }

  } catch(e) { console.error("Erreur:", e); }
}

function saveLastTrade(setup, result) {
    lastTrade = { entry: setup.entry, sl: setup.sl, tp: setup.tp, result: result };
    $('lastTradeBox').style.display = 'block';
    const dec = getDecimals(currentSymbol);
    const fmt = (p) => p.toLocaleString('fr-FR', {minimumFractionDigits: dec, maximumFractionDigits: dec});
    $('lt-entry').textContent = fmt(lastTrade.entry);
    $('lt-sl').textContent = fmt(lastTrade.sl);
    $('lt-tp').textContent = fmt(lastTrade.tp);
    const resEl = $('lt-result');
    if (lastTrade.result === 'TP') { resEl.textContent = "✅ TP Atteint"; resEl.style.color = "var(--up)"; }
    else { resEl.textContent = "❌ SL Touché"; resEl.style.color = "var(--down)"; }
}

function updateTradeStatus(price, isCurrentUp, timeLeftStr) {
    const statusDiv = $('tradeStatus');
    statusDiv.className = ''; 

    if (tradeState === 'COOLDOWN') {
        statusDiv.innerHTML = `😴 Pause (${timeLeftStr})<br><button class="btn-skip" onclick="skipCooldown()">Passer l'attente</button>`; 
        statusDiv.classList.add('status-cooldown'); return;
    }
    if (!lockedSetup) {
        statusDiv.textContent = `🔍 ${$('confReason').textContent}`; statusDiv.classList.add('status-wait'); return;
    }

    const setup = lockedSetup;
    const tolerance = price * 0.0002; 
    const isBuy = setup.type === 'buy';

    if ((isBuy && price >= setup.tp) || (!isBuy && price <= setup.tp)) {
        statusDiv.textContent = `🎯 TP atteint !`; statusDiv.classList.add('status-progress'); return;
    }

    if (price >= setup.entry - tolerance && price <= setup.entry + tolerance) {
        let isConfluent = (isBuy && trends.htf1 === 'up' && trends.htf2 === 'up') || (!isBuy && trends.htf1 === 'down' && trends.htf2 === 'down');
        let conflict = (isBuy && (trends.htf1 === 'down' || trends.htf2 === 'down')) || (!isBuy && (trends.htf1 === 'up' || trends.htf2 === 'up'));
        if (conflict) { statusDiv.textContent = `⚠️ Entrée atteinte, CONFLIT MTF`; statusDiv.classList.add('status-wait'); }
        else if (isConfluent) { statusDiv.textContent = `🔥 CONFLUENCE PARFAITE !`; statusDiv.classList.add('status-confluence'); }
        else { statusDiv.textContent = `⚡ ZONE D'ENTRÉE !`; statusDiv.classList.add('status-entry'); }
        return;
    }

    if ((isBuy && price > setup.entry) || (!isBuy && price < setup.entry)) {
        statusDiv.textContent = `⏳ Attendre le repli vers ${setup.entry.toFixed(2)}`; statusDiv.classList.add('status-wait');
    } else {
        statusDiv.textContent = `🚀 Trade en cours...`; statusDiv.classList.add('status-progress');
    }
}

window.skipCooldown = function() {
    if (tradeState === 'COOLDOWN') {
        tradeState = 'IDLE';
        cooldownEndTime = 0;
        analyzeSMC(); 
    }
};

function renderPanel(isCurrentUp) {
  const dec = getDecimals(currentSymbol);
  const fmt = (p) => p.toLocaleString('fr-FR', {minimumFractionDigits: dec, maximumFractionDigits: dec});
  
  let html = `
    <div style="padding:10px 15px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;">
      <div><div style="font-size:11px; color:var(--muted);">Prix actuel</div><div style="font-size:15px; font-weight:bold;">${fmt(currentPrice)}</div></div>
      <div style="text-align:right; font-size:10px; color:var(--muted);">R:R Fixé à 2.0</div>
    </div>
  `;

  if (lockedSetup && tradeState === 'ACTIVE') {
      const isBuy = lockedSetup.type === 'buy';
      html += `
        <div class="setup ${isBuy ? 'buy' : 'sell'}">
          <div class="setup-title"><span>${isBuy ? '🟢 ACHAT' : '🔴 VENTE'}</span></div>
          <div class="trade-grid">
            <div class="cell precision"><small>Entrée</small><b>${fmt(lockedSetup.entry)}</b></div>
            <div class="cell"><small>Stop-Loss</small><b>${fmt(lockedSetup.sl)}</b></div>
            <div class="cell"><small>TP (R:R 2)</small><b>${fmt(lockedSetup.tp)}</b></div>
          </div>
        </div>
      `;
  } else {
      html += `<div class="loading-text">Aucun setup validé.</div>`;
  }

  $('analysisContent').innerHTML = html;
}

function drawLines(setup) {
  priceLines.forEach(line => candleSeries.removePriceLine(line));
  priceLines = [];
  if (!setup || tradeState !== 'ACTIVE') return; 
  
  const addLine = (price, color, title, style) => {
    const line = candleSeries.createPriceLine({ price, color, lineWidth: 2, lineStyle: style, axisLabelVisible: true, title });
    priceLines.push(line);
  };
  addLine(setup.entry, '#2962ff', 'Entrée', LightweightCharts.LineStyle.Solid);
  addLine(setup.sl, '#ef5350', 'SL', LightweightCharts.LineStyle.Dashed);
  addLine(setup.tp, '#26a69a', 'TP (RR2)', LightweightCharts.LineStyle.Dashed);
}

window.addEventListener('load', () => {
  initChart();
  setTimeout(() => {
    fetchMainData();
    fetchHTF();
    if (updateInterval) clearInterval(updateInterval);
    updateInterval = setInterval(fetchMainData, 5000); 
    if (htfInterval) clearInterval(htfInterval);
    htfInterval = setInterval(fetchHTF, 60000);
  }, 300);
});

$('symbolSelect').addEventListener('change', (e) => { 
    currentSymbol = e.target.value; localStorage.setItem('cv_symbol', currentSymbol); 
    lockedSetup = null; tradeState = 'IDLE'; lastTrade = null; cooldownEndTime = 0; $('lastTradeBox').style.display = 'none'; $('confluenceBox').style.display = 'none';
    fetchMainData(); fetchHTF(); 
});
$('tfSelect').addEventListener('change', (e) => { 
    currentTF = e.target.value; localStorage.setItem('cv_tf', currentTF); 
    lockedSetup = null; tradeState = 'IDLE'; lastTrade = null; cooldownEndTime = 0; $('lastTradeBox').style.display = 'none'; $('confluenceBox').style.display = 'none';
    updateHTFTargets(); fetchMainData(); fetchHTF(); 
});
</script>
